<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际新闻 · 谷歌热榜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Microsoft YaHei','PingFang SC',-apple-system,sans-serif;background:#eef1f5;color:#1f2d3d}
.wrap{max-width:1240px;margin:0 auto;padding:14px}
.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:12px}
.brand{font-size:22px;font-weight:800;letter-spacing:1px;color:#1f2d3d}
.brand small{font-size:13px;color:#8a97a5;font-weight:400;margin-left:8px}
.meta{font-size:12px;color:#8a97a5}
.spacer{flex:1}
.btn{cursor:pointer;border:none;border-radius:20px;padding:8px 16px;font-size:14px;background:#2f9e6e;color:#fff;font-weight:600;transition:.2s}
.btn:hover{opacity:.85}
.pager{display:flex;gap:6px}
.pbtn{width:34px;height:34px;border-radius:50%;border:2px solid #cfd6de;background:#fff;color:#3a4a5a;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.pbtn.active{background:#1f2d3d;color:#fff;border-color:#1f2d3d}
.lead{background:linear-gradient(135deg,#16222f,#2c3e50);border-radius:14px;padding:22px 24px;color:#fff;margin-bottom:12px;cursor:pointer;transition:.2s}
.lead:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.18)}
.lead .tag{display:inline-block;background:#e74c3c;border-radius:4px;padding:2px 8px;font-size:12px;font-weight:700;margin-bottom:10px}
.lead h2{font-size:26px;line-height:1.4;margin-bottom:8px}
.lead .sub{font-size:14px;color:#c9d4df;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lead .info{font-size:12px;color:#8fa3b8;margin-top:10px}
.subs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sub{background:#fff;border-radius:12px;padding:16px 18px;cursor:pointer;border:1px solid #e3e7ec;transition:.2s}
.sub:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
.sub h3{font-size:17px;line-height:1.45;margin-bottom:8px}
.sub .info{font-size:12px;color:#8a97a5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;padding:14px 16px;cursor:pointer;border:1px solid #e3e7ec;display:flex;flex-direction:column;gap:8px;transition:.2s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-2px)}
.card h4{font-size:15px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.cat{font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.c-world{background:#fdecea;color:#c0392b}
.c-op-ed{background:#fef5e7;color:#b9770e}
.c-finance{background:#eaf2fb;color:#2c6cb0}
.c-tech{background:#e9f7ef;color:#1e8449}
.c-general{background:#f0f2f5;color:#5d6d7e}
.cn{background:#fef9e7;color:#b7950b;border:1px solid #f4d03f}
.src{font-size:12px;color:#8a97a5;font-weight:600}
.time{font-size:12px;color:#aab4be}
.status{text-align:center;color:#8a97a5;font-size:12px;padding:16px 0 6px}
.err{text-align:center;color:#c0392b;font-size:14px;padding:30px}
@media(max-width:720px){.subs,.grid{grid-template-columns:1fr}.lead h2{font-size:20px}.brand{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">国际新闻<small>谷歌热榜 · 全球要闻</small></div>
    <div class="meta" id="meta"></div>
    <div class="spacer"></div>
    <div class="pager">
      <button class="pbtn active" id="pg1" onclick="goPage(1)">1</button>
      <button class="pbtn" id="pg2" onclick="goPage(2)">2</button>
    </div>
    <button class="btn" onclick="refresh()">更新</button>
  </div>
  <div id="content"></div>
  <div class="status" id="status"></div>
</div>
<script>
var articles=[],page=1,PAGE_SIZE=50;
var CAT_ZH={world:'国际大事',op_ed:'社论',finance:'财经',tech:'科技',general:'综合'};
function fmtTime(iso){
  var d=new Date(iso),p=function(n){return n<10?'0'+n:n};
  return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function render(){
  var list=articles.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE),html='';
  if(!list.length){document.getElementById('content').innerHTML='<div class="err">暂无新闻</div>';return;}
  var a=list[0];
  var summary=(a.content_orig||a.summary_zh||'').replace(/\s+/g,' ').slice(0,160);
  html+='<div class="lead" onclick="openUrl(\''+esc(a.url||'#')+'\')">'+
    '<span class="tag">头条</span>'+
    '<h2>'+esc(a.title_orig)+'</h2>'+
    '<div class="sub">'+esc(summary)+'</div>'+
    '<div class="info">'+esc(a.agency||a.source||'')+' · '+fmtTime(a.published_at)+'</div></div>';
  var i;
  if(list.length>1){
    html+='<div class="subs">';
    for(i=1;i<Math.min(3,list.length);i++){
      html+='<div class="sub" onclick="openUrl(\''+esc(list[i].url||'#')+'\')">'+
        '<h3>'+esc(list[i].title_orig)+'</h3>'+
        '<div class="info">'+esc(list[i].agency||list[i].source||'')+' · '+fmtTime(list[i].published_at)+'</div></div>';
    }
    html+='</div>';
  }
  html+='<div class="grid">';
  for(i=3;i<list.length;i++){
    var b=list[i],cat=b.category||'general';
    var catKey=cat==='op-ed'?'op_ed':cat;
    html+='<div class="card" onclick="openUrl(\''+esc(b.url||'#')+'\')">'+
      '<h4>'+esc(b.title_orig)+'</h4>'+
      '<div class="row">'+
      '<span class="cat c-'+(cat==='op-ed'?'op-ed':cat)+'">'+(CAT_ZH[catKey]||'综合')+'</span>'+
      (b._china?'<span class="cat cn">中国相关</span>':'')+
      '<span class="src">'+esc(b.agency||b.source||'')+'</span>'+
      '<span class="time">'+fmtTime(b.published_at)+'</span>'+
      '</div></div>';
  }
  html+='</div>';
  document.getElementById('content').innerHTML=html;
  document.getElementById('pg1').className='pbtn'+(page===1?' active':'');
  document.getElementById('pg2').className='pbtn'+(page===2?' active':'');
}
function openUrl(u){if(u&&u!=='#')window.open(u,'_blank');}
function goPage(p){page=p;render();}
function refresh(){
  var s=document.getElementById('status');s.textContent='正在加载…';
  fetch('news.json?t='+Date.now()).then(function(r){return r.json();}).then(function(j){
    articles=(j.articles||[]).slice().sort(function(x,y){return new Date(y.published_at)-new Date(x.published_at);});
    document.getElementById('meta').textContent='共 '+articles.length+' 条 · 更新于 '+j.updated_at.replace('T',' ').slice(0,19);
    render();
    s.textContent='';
    if(!articles.length)s.textContent='暂无新闻';
  }).catch(function(e){s.textContent='加载失败：'+e.message;});
}
refresh();
setInterval(refresh,300000);
</script>
</body>
</html>
