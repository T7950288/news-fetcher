<!-- v2-trigger -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谷歌热榜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
         background:#f5f6f8; color:#1a1a1a; line-height:1.6; }
  header { background:#1a3a6c; color:#fff; padding:12px 20px; position:sticky; top:0; z-index:100;
           box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .header-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .logo { font-size:20px; font-weight:700; letter-spacing:1px; white-space:nowrap; }
  .nav-tabs { display:flex; gap:6px; }
  .nav-tab { padding:6px 16px; border-radius:18px; font-size:14px; color:#fff; text-decoration:none;
             border:1px solid rgba(255,255,255,.5); font-weight:600; }
  .nav-tab.active { background:#fff; color:#1a3a6c; border-color:#fff; }
  .nav-tab:hover { background:rgba(255,255,255,.25); }
  .nav-tab.active:hover { background:#fff; }
  .nav-tab .short { display:none; }
  .refresh-btn { background:#fff; color:#1a3a6c; border:none; padding:8px 18px; border-radius:6px;
                 font-size:14px; cursor:pointer; font-weight:600; }
  .refresh-btn:active { transform:scale(.96); }
  .refresh-btn:disabled { opacity:.5; cursor:wait; }
  .meta { max-width:960px; margin:10px auto 0; padding:0 20px; font-size:12px; color:#666; }
  .tabs { max-width:960px; margin:14px auto 0; padding:0 20px; display:flex; gap:8px; flex-wrap:wrap; }
  .tab { padding:6px 16px; border-radius:20px; background:#fff; border:1px solid #ddd; font-size:13px;
         cursor:pointer; color:#555; }
  .tab.active { background:#1a3a6c; color:#fff; border-color:#1a3a6c; }
  .list { max-width:960px; margin:16px auto 40px; padding:0 20px; }
  .card { background:#fff; border-radius:10px; padding:16px 18px; margin-bottom:10px; cursor:pointer;
          box-shadow:0 1px 3px rgba(0,0,0,.06); transition:box-shadow .15s; }
  .card:hover { box-shadow:0 3px 12px rgba(0,0,0,.1); }
  .card-title { font-size:16px; font-weight:600; color:#1a1a1a; margin-bottom:6px; }
  .card-meta { font-size:12px; color:#888; display:flex; gap:10px; flex-wrap:wrap; }
  .tag { display:inline-block; padding:1px 8px; border-radius:4px; font-size:11px; }
  .tag-world { background:#e8f0fe; color:#1a3a6c; }
  .tag-op-ed { background:#fce8e6; color:#a50e0e; }
  .tag-finance { background:#e6f4ea; color:#137333; }
  .tag-tech { background:#f3e8fd; color:#7627bb; }
  .tag-general { background:#f1f3f4; color:#5f6368; }
  .tag-country { background:#f1f3f4; color:#5f6368; }
  /* 详情模态框 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; overflow-y:auto; }
  .modal.show { display:block; }
  .modal-body { background:#fff; max-width:720px; margin:30px auto; border-radius:12px; padding:30px; }
  .modal-close { float:right; background:none; border:none; font-size:22px; cursor:pointer; color:#999; }
  .modal-close-bottom { display:inline-block; padding:10px 30px; font-size:15px; border:1px solid #ddd; border-radius:20px; background:#f7f7f7; color:#333; cursor:pointer; }
  .modal-close-bottom:active { background:#eee; }
  .modal h2 { font-size:20px; margin-bottom:10px; line-height:1.4; }
  .modal-meta { font-size:12px; color:#888; margin-bottom:20px; padding-bottom:12px; border-bottom:1px solid #eee; }
  .section-label { font-size:13px; font-weight:700; color:#1a3a6c; margin:18px 0 8px; }
  .section-label.orig { color:#7627bb; }
  .modal p { margin-bottom:10px; font-size:15px; }
  .loading { text-align:center; padding:60px 20px; color:#999; }
  .source-link { font-size:12px; color:#1a3a6c; }
  /* 无跳转双版块容器 */
  .pane { display:none; }
  .pane.active { display:block; }
  #mapPane.active { display:block; height:calc(100vh - 54px); }
  #mapFrame { width:100%; height:100%; border:0; display:block; }
  /* 手机端适配 */
  @media (max-width:768px){
    header { padding:10px 12px; }
    #mapPane.active { height:calc(100vh - 50px); }
    .nav-tabs-wrap { position:relative; min-width:0; flex:1; }
    .nav-tabs { overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
                white-space:nowrap; flex-wrap:nowrap; }
    .nav-tabs::-webkit-scrollbar { display:none; }
    .nav-tab { display:inline-flex; flex:none; padding:5px 11px; font-size:13px; }
    .nav-tab .full { display:none; }
    .nav-tab .short { display:inline; }
    .nav-tabs-wrap::after { content:""; position:absolute; right:0; top:0; bottom:0; width:20px;
      background:linear-gradient(to left, rgba(26,58,108,.92), transparent); pointer-events:none;
      opacity:0; transition:opacity .2s; }
    .nav-tabs-wrap.scrollable::after { opacity:1; }
    .refresh-btn { padding:7px 14px; font-size:13px; }
    .card { padding:13px 14px; }
    .card-title { font-size:15px; }
    .modal-body { margin:12px auto; padding:20px 16px; border-radius:10px; }
    .meta, .tabs, .list { padding-left:14px; padding-right:14px; }
    .tab { padding:5px 12px; font-size:12px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="nav-tabs-wrap">
      <nav class="nav-tabs">
        <a class="nav-tab active" href="./" data-section="home"><span class="full">谷歌热榜</span><span class="short">谷歌</span></a>
        <a class="nav-tab" href="travel/" data-section="map"><span class="full">旅游地图</span><span class="short">地图</span></a>
      </nav>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="loadNews()">更新</button>
  </div>
</header>
<div id="homePane" class="pane active">
  <div class="meta" id="meta">正在加载新闻…</div>
  <div class="list" id="list"><div class="loading">加载中…</div></div>
</div>
<div id="mapPane" class="pane">
  <iframe id="mapFrame" src="travel/" title="旅游地图"></iframe>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-body" id="modalBody"></div>
</div>
<script>
const URL = "https://t7950288.github.io/news-fetcher/news.json";
/* Gitee API：国内直连快、云端每15分钟实时同步（浏览器已确认可跨域访问） */
const GITEE_API = "https://gitee.com/api/v5/repos/t7950288/news/contents/news.json?ref=master";
/* GitHub 实时源兜底（jsDelivr 有12小时缓存会返回旧数据，news.json 每15分钟更新，不能用） */
const NEWS_SOURCES = [
  "https://t7950288.github.io/news-fetcher/news.json",
  "https://raw.githubusercontent.com/T7950288/news-fetcher/main/news.json"
];
const CACHE_KEY = "gh_news_cache_v1";
const CATS = [
  ["world","国际大事"],["op-ed","社论"],["finance","财经"],["tech","科技"],["general","综合"]
];
let ALL = [];
let savedScrollY = 0;
let lastUpdatedAt = "";

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;"); }

async function triggerFetch(){
  document.getElementById("meta").textContent = "手机版为自动更新：云端每15分钟自动抓取，页面每5分钟自动刷新，无需手动点更新";
  throw new Error("readonly");
}

async function fetchJson(u, isGitee){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try{
    const r = await fetch(u + (isGitee ? "" : "?_t=" + Date.now()), {cache:"no-store", signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if(isGitee){ const raw = atob(j.content); return JSON.parse(raw); }
    return j;
  }catch(e){ clearTimeout(timer); throw e; }
}

/* 首开/手动更新：Gitee 优先（国内快），失败切 GitHub 实时源 */
async function fetchData(){
  try{ return await fetchJson(GITEE_API, true); }
  catch(e){ return await Promise.any(NEWS_SOURCES.map(u => fetchJson(u, false))); }
}
/* 后台自动检查：只走 GitHub（不打扰首开），供 30 秒检查与 5 分钟自动刷新 */
async function fetchDataQuiet(){
  return await fetchJson(NEWS_SOURCES[0], false);
}

function showData(data){
  lastUpdatedAt = data.updated_at||"";
  ALL = (data.articles||[]).slice().sort((a,b)=> (b.published_at||"").localeCompare(a.published_at||""));
  document.getElementById("meta").textContent =
    "共 " + ALL.length + " 条 · 更新于 " + (data.updated_at||"").replace("T"," ").replace(/\+.*/,"");
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({updated_at:lastUpdatedAt, items:ALL.slice()})); }catch(e){}
  renderList();
}

/* 首开策略：直接拉最新，拉到才显示（打开即最新）；连不上才回退上次缓存并明确提示 */
async function initNews(){
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY)||"null"); }catch(e){}
  try{
    const d = await fetchData();
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({updated_at:d.updated_at||"", items:(d.articles||[]).slice()})); }catch(e){}
    showData(d);
    return;
  }catch(e){
    try{
      const c = JSON.parse(localStorage.getItem(CACHE_KEY)||"null");
      if(c && c.updated_at && Array.isArray(c.items) && c.items.length){
        lastUpdatedAt = c.updated_at;
        ALL = c.items;
        renderList();
        document.getElementById("meta").textContent =
          "共 " + ALL.length + " 条 · 更新于 " + c.updated_at.replace("T"," ").replace(/\+.*/,"") + "（未能联网更新，显示上次缓存）";
      }else{
        document.getElementById("meta").textContent = "加载失败：" + e.message;
      }
    }catch(e2){
      document.getElementById("meta").textContent = "加载失败：" + e.message;
    }
  }
}

async function loadNews(){
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  let triggered = false;
  try{
    btn.textContent = "正在抓取最新新闻…";
    try{
      await triggerFetch();
      triggered = true;
    }catch(e){ /* GitHub连不上则直接拉现有数据 */ }
    if(triggered){
      for(let i=0;i<36;i++){
        await new Promise(res=>setTimeout(res,5000));
        btn.textContent = "抓取中…" + Math.round((i+1)*5) + "秒";
        try{
          const d = await fetchData();
          if(d.updated_at && d.updated_at !== lastUpdatedAt){ showData(d); return; }
        }catch(e){}
      }
    }
    const d = await fetchData();
    showData(d);
  }catch(e){
    document.getElementById("meta").textContent = "加载失败：" + e.message;
  }finally{
    btn.disabled = false; btn.textContent = "更新";
  }
}

function srcName(a){ return a._google ? (a.source + " · Google热榜") : a.source; }

function renderList(){
  const el = document.getElementById("list");
  const rows = ALL.slice();
  if(!rows.length){ el.innerHTML = '<div class="loading">暂无新闻</div>'; return; }
  el.innerHTML = rows.map(a=>{
    const time = (a.published_at||"").replace("T"," ").replace(/\+.*/,"").slice(5,16);
    return `<div class="card" onclick='openDetail(${ALL.indexOf(a)})'>
      <div class="card-title">${esc(a.title_orig || a.title_zh || "")}</div>
      <div class="card-meta">
        <span class="tag tag-country">${a.country}</span>
        <span>${esc(srcName(a))}</span>
        <span>${time}</span>
      </div></div>`;
  }).join("");
}

function openDetail(i){
  const a = ALL[i];
  const time = (a.published_at||"").replace("T"," ").replace(/\+.*/,"");
  const body = document.getElementById("modalBody");
  body.innerHTML = `
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2>${esc(a.title_orig || a.title_zh || "")}</h2>
    <div class="modal-meta">
      <span class="tag tag-country">${a.country}</span>
      ${esc(srcName(a))} · ${time}
    </div>
    <div class="section-label">原文全文</div>
    <div>${esc(a.content_orig).split("\n").map(p=>`<p>${p}</p>`).join("")}</div>
    <div style="text-align:center;margin-top:26px;"><button class="modal-close-bottom" onclick="closeModal()">关闭</button></div>`;
  document.getElementById("modal").classList.add("show");
  savedScrollY = window.scrollY;
  document.getElementById("modal").scrollTop = 0;
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
  window.scrollTo(0, savedScrollY);
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

async function autoCheck(){
  // 详情打开时不打扰
  const m = document.getElementById("modal");
  if(m && m.classList.contains("show")) return;
  try{
    const d = await fetchDataQuiet();
    if(d.updated_at && d.updated_at !== lastUpdatedAt){
      const y = window.scrollY;
      showData(d);
      window.scrollTo(0, y);
    }
  }catch(e){}
}

// 每5分钟自动刷新一次: 拉取最新数据, 有更新则静默重渲染(保留滚动位置), 不打扰详情页
async function autoRefresh5(){
  const m = document.getElementById("modal");
  if(m && m.classList.contains("show")) return;
  const btn = document.getElementById("refreshBtn");
  if(btn && btn.disabled) return; // 手动"更新"进行中不重复
  try{
    const d = await fetchDataQuiet();
    if(d.updated_at && d.updated_at !== lastUpdatedAt){
      const y = window.scrollY;
      showData(d);
      window.scrollTo(0, y);
      document.getElementById("meta").textContent =
        "共 " + ALL.length + " 条 · 更新于 " + (d.updated_at||"").replace("T"," ").replace(/\+.*/,"") + " · 已自动刷新";
    }
  }catch(e){}
}

initNews();
setInterval(autoCheck, 30000); // 每30秒静默检查数据更新（后台走 GitHub）
setInterval(autoRefresh5, 300000); // 每5分钟自动刷新最新数据

// 版块导航：可滚动时显示右侧渐隐提示
function checkNavScroll(){
  const wrap = document.querySelector('.nav-tabs-wrap');
  const tabs = wrap ? wrap.querySelector('.nav-tabs') : null;
  if(wrap && tabs) wrap.classList.toggle('scrollable', tabs.scrollWidth > tabs.clientWidth);
}
checkNavScroll();
window.addEventListener('resize', checkNavScroll);

// ===== 无跳转切换：热榜 / 地图 同一页面切换显示 =====
const mapFrame = document.getElementById('mapFrame');
const homePane = document.getElementById('homePane');
const mapPane = document.getElementById('mapPane');
const refreshBtn = document.getElementById('refreshBtn');
let savedHomeScroll = 0;

function hideMapHeader(){
  try{
    const doc = mapFrame.contentDocument;
    if(doc && doc.querySelector('.site-header')){
      doc.querySelector('.site-header').style.display = 'none';
    }
  }catch(e){}
}
function fixMapSize(){
  // 地图可能在隐藏容器里初始化过：触发 iframe 内 resize 事件，Leaflet 自动重排尺寸、补加载瓦片
  setTimeout(()=>{
    try{
      const w = mapFrame.contentWindow;
      if(!w) return;
      if(w.map && w.map.invalidateSize){ w.map.invalidateSize(); }
      w.dispatchEvent(new w.Event('resize'));
    }catch(e){}
  }, 120);
}
mapFrame.addEventListener('load', ()=>{
  hideMapHeader();
  if(mapPane.classList.contains('active')) fixMapSize();
});

function switchSection(key){
  document.querySelectorAll('.nav-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.section === key));
  if(key === 'map'){
    savedHomeScroll = window.scrollY;
    homePane.classList.remove('active');
    mapPane.classList.add('active');
    if(refreshBtn) refreshBtn.style.display = 'none';
    window.scrollTo(0, 0);
    hideMapHeader();
    fixMapSize();
  }else{
    mapPane.classList.remove('active');
    homePane.classList.add('active');
    if(refreshBtn) refreshBtn.style.display = '';
    window.scrollTo(0, savedHomeScroll);
  }
}
document.querySelectorAll('.nav-tab').forEach(t => {
  t.addEventListener('click', e => {
    e.preventDefault();
    switchSection(t.dataset.section);
  });
});
</script>
</body>
</html>
