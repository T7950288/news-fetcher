<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音乐球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#060b1d; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#fff; user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #back {
    position:fixed; left:14px; top:12px; z-index:30;
    background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.25); border-radius:20px;
    padding:8px 16px; font-size:15px; cursor:pointer; line-height:1;
  }
  #back:active { background:rgba(255,255,255,.32); }

  #hud {
    position:fixed; left:14px; top:58px; z-index:30;
    font-size:12px; color:rgba(255,255,255,.65); letter-spacing:1px;
  }

  #title {
    position:fixed; left:50%; top:9%; transform:translateX(-50%); z-index:30;
    text-align:center; pointer-events:none;
  }
  #title h1 { font-size:min(9vw,44px); font-weight:800; letter-spacing:6px;
    background:linear-gradient(180deg,#fff,#8fd0ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #title p { margin-top:8px; font-size:min(3.6vw,15px); color:rgba(255,255,255,.8); letter-spacing:1px; }

  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px;
    background:radial-gradient(ellipse at center, rgba(10,20,50,.52) 0%, rgba(3,6,18,.78) 100%);
    transition:opacity .45s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }

  #pickBtn {
    background:linear-gradient(135deg,#2f7bff,#5b4dff); color:#fff;
    border:none; border-radius:30px; padding:15px 38px;
    font-size:min(4.5vw,18px); font-weight:700; letter-spacing:2px; cursor:pointer;
    box-shadow:0 6px 22px rgba(70,100,255,.45);
  }
  #pickBtn:active { transform:scale(.96); }
  #hint { font-size:min(3.4vw,14px); color:rgba(255,255,255,.65); text-align:center; line-height:1.8; }

  #ctrl {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:10px; white-space:nowrap;
  }
  .cb {
    background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.28); border-radius:22px;
    padding:10px 20px; font-size:14px; cursor:pointer; letter-spacing:1px; line-height:1;
  }
  .cb:active { background:rgba(255,255,255,.34); }
  .cb:disabled { opacity:.4; cursor:default; }
  #st { font-size:12px; color:rgba(255,255,255,.55); padding:0 4px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="back">返回游戏</div>
<div id="hud"></div>

<div id="title">
  <h1>音乐球</h1>
  <p>上传音乐，彩虹泡泡在 3D 空间里随鼓点舞动</p>
</div>

<div id="overlay">
  <button id="pickBtn">选择音乐开始</button>
  <div id="hint">支持 MP3 / M4A / WAV 等常见音频<br>选一首你喜欢的歌，看泡泡跳舞</div>
</div>

<div id="ctrl">
  <button class="cb" id="swapBtn" disabled>换歌</button>
  <button class="cb" id="playBtn" disabled>播放</button>
  <button class="cb" id="pauseBtn" disabled>暂停</button>
  <span id="st">未选择音乐</span>
</div>

<input type="file" id="file" accept="audio/*" style="display:none">

<script>
(function () {
  "use strict";

  /* ========== 基础 ========== */
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ========== 球群（永远在画面内） ========== */
  var FOCAL = 1.8;
  var N = 40;
  var balls = [];
  var seedRand = Math.random;

  function makeBall() {
    return {
      x: -0.5 + seedRand() * 1.0,      // 横向 ±0.5
      y: -0.15 + seedRand() * 0.55,    // 纵向 -0.15 ~ 0.40（保证不出屏）
      z: 0.8 + seedRand() * 1.2,       // 纵深 0.8 ~ 2.0
      baseR: 0.07 + seedRand() * 0.13, // 基础半径
      hue: seedRand() * 360,
      speed: 0.6 + seedRand() * 0.9,
      seed: seedRand() * 100,
      bob: 0, puls: 1
    };
  }
  for (var i = 0; i < N; i++) balls.push(makeBall());

  /* ========== 音频 ========== */
  var audio = null, audioCtx = null, analyser = null, srcNode = null;
  var freq = null;
  var isPlaying = false;
  var fileName = "";

  var fileInput = document.getElementById("file");
  var pickBtn = document.getElementById("pickBtn");
  var overlay = document.getElementById("overlay");
  var swapBtn = document.getElementById("swapBtn");
  var playBtn = document.getElementById("playBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var st = document.getElementById("st");
  var hud = document.getElementById("hud");

  function loadAudio(file) {
    if (!file) return;
    fileName = file.name;
    var url = URL.createObjectURL(file);
    if (!audio) {
      audio = new Audio();
      audio.preload = "auto";
      audio.loop = true;
    }
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    audio.src = url;
    audio.oncanplaythrough = function () {
      if (audioCtx) {
        if (!srcNode) {
          srcNode = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 256;
          srcNode.connect(analyser);
          analyser.connect(audioCtx.destination);
          freq = new Uint8Array(analyser.frequencyBinCount);
        }
        audioCtx.resume && audioCtx.resume();
      }
      startPlay();
    };
    audio.onerror = function () { st.textContent = "音频加载失败，请换一首"; };
  }

  function startPlay() {
    audio.play();
    isPlaying = true;
    swapBtn.disabled = false;
    playBtn.disabled = true;
    pauseBtn.disabled = false;
    st.textContent = "播放中";
    overlay.classList.add("hidden");
  }

  pickBtn.addEventListener("click", function () { fileInput.click(); });
  swapBtn.addEventListener("click", function () { fileInput.click(); });
  playBtn.addEventListener("click", function () {
    if (!audio) return;
    audio.play();
    isPlaying = true;
    playBtn.disabled = true; pauseBtn.disabled = false;
    st.textContent = "播放中";
  });
  pauseBtn.addEventListener("click", function () {
    if (!audio) return;
    audio.pause();
    isPlaying = false;
    playBtn.disabled = false; pauseBtn.disabled = true;
    st.textContent = "已暂停";
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) loadAudio(fileInput.files[0]);
  });

  /* ========== 渲染 ========== */
  function drawBackground(time) {
    // 深蓝渐变背景
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a1330");
    g.addColorStop(0.5, "#0a0f26");
    g.addColorStop(1, "#050918");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 星空（静态小点，随音乐微闪）
    var starN = 90;
    for (var i = 0; i < starN; i++) {
      var sx = ((i * 61) % 100) / 100 * W;
      var sy = ((i * 37) % 100) / 100 * H;
      var tw = 0.35 + 0.65 * Math.abs(Math.sin(time * 0.0012 + i * 1.7));
      ctx.fillStyle = "rgba(255,255,255," + (0.25 * tw).toFixed(3) + ")";
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  function project(px, py, pz) {
    var k = FOCAL / pz;
    return { sx: px * W * 0.4 * k + W / 2, sy: py * H * 0.42 * k + H * 0.55, k: k };
  }

  function drawBall(b, time, bass, mid) {
    var bounce = bass;                    // 鼓点能量
    var puls = 1 + bounce * 0.7;          // 脉冲放大
    var sway = mid * 0.1 * Math.sin(time * 0.003 * b.speed + b.seed);
    var idle = isPlaying ? 0 : 0.025 * Math.sin(time * 0.0015 + b.seed * 6);
    var x = b.x + sway;
    var y = b.y - bounce * 0.45 + idle;
    var z = b.z;
    var p = project(x, y, z);

    var r = Math.max(4, b.baseR * p.k * 330 * puls);
    var bright = 62 + bounce * 35 + mid * 12;
    if (bright > 100) bright = 100;

    // 远球淡、近球实
    var a = 0.55 + (2.0 - z) * 0.42;
    if (a > 0.98) a = 0.98;

    // 球体：径向渐变（亮心 → 深边），加高光点，不用阴影特效
    var g = ctx.createRadialGradient(
      p.sx - r * 0.3, p.sy - r * 0.35, r * 0.15,
      p.sx, p.sy, r
    );
    g.addColorStop(0, "hsla(" + b.hue + ",100%," + (bright + 22) + "%," + a.toFixed(3) + ")");
    g.addColorStop(0.55, "hsla(" + b.hue + ",95%," + bright + "%," + a.toFixed(3) + ")");
    g.addColorStop(1, "hsla(" + b.hue + ",90%," + Math.max(12, bright - 40) + "%," + a.toFixed(3) + ")");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.sx, p.sy, r, 0, 6.2832);
    ctx.fill();

    // 高光小点（增强球体立体感）
    ctx.fillStyle = "rgba(255,255,255," + (0.5 * a).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(p.sx - r * 0.32, p.sy - r * 0.36, r * 0.18, 0, 6.2832);
    ctx.fill();
  }

  /* ========== 底部琴键 ========== */
  function drawKeys(time, mid, high) {
    var keyN = 10;
    var gap = 5;
    var totalW = keyN * 26 + (keyN - 1) * gap;
    var x0 = (W - totalW) / 2;
    var y0 = H - 56;
    var glow = (mid + high) * 0.5;
    for (var i = 0; i < keyN; i++) {
      var lit = 0.12 + glow * (0.75 + 0.25 * Math.sin(time * 0.006 + i * 0.8));
      var hueK = (i / keyN) * 300;
      ctx.fillStyle = "hsla(" + hueK + ",85%," + Math.round(18 + lit * 55) + "%," + (0.5 + lit * 0.5).toFixed(3) + ")";
      var rw = 6;
      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(x0 + i * (26 + gap), y0, 26, 30, rw) : ctx.rect(x0 + i * (26 + gap), y0, 26, 30);
      ctx.fill();
    }
  }

  /* ========== 主循环 ========== */
  var lastT = 0;
  var bassSm = 0, midSm = 0, highSm = 0;

  function loop(t) {
    var dt = Math.min(50, t - lastT || 16);
    lastT = t;

    // 频谱 → 能量
    var bass = 0, mid = 0, high = 0;
    if (isPlaying && analyser && freq) {
      analyser.getByteFrequencyData(freq);
      for (var i = 0; i < 12; i++) bass += freq[i];
      for (var i = 12; i < 40; i++) mid += freq[i];
      for (var i = 40; i < 90; i++) high += freq[i];
      bass = bass / (12 * 255);
      mid = mid / (28 * 255);
      high = high / (50 * 255);
      bass = Math.pow(bass, 1.25);
      mid = Math.pow(mid, 1.2);
      high = Math.pow(high, 1.2);
    }
    // 平滑
    bassSm += (bass - bassSm) * 0.25;
    midSm += (mid - midSm) * 0.3;
    highSm += (high - highSm) * 0.3;

    drawBackground(t);
    for (var j = 0; j < balls.length; j++) drawBall(balls[j], t, bassSm, midSm);
    drawKeys(t, midSm, highSm);

    // HUD 小字
    hud.textContent = isPlaying ? ("♫ " + fileName + "　·　BASS " + Math.round(bassSm * 100)) : "";

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 返回游戏
  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1) history.back();
    else location.href = "index.html";
  });
})();
</script>
</body>
</html>
