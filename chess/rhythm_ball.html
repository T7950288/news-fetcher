<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>音乐球</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='35%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='50%25' stop-color='%237fd4ff'/%3E%3Cstop offset='100%25' stop-color='%238a5cff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a1230; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }

  canvas { display: block; width: 100vw; height: 100vh; }

  /* 顶部HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 60px 20px 16px; z-index: 10; pointer-events: none;
  }
  #backBtn {
    position: fixed; top: 12px; left: 12px; z-index: 30;
    border: 1px solid rgba(140,200,255,0.25);
    background: rgba(10,20,50,0.6); backdrop-filter: blur(12px);
    color: #fff; border-radius: 999px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: background 0.2s;
  }
  #backBtn:hover { background: rgba(20,40,80,0.8); }
  .hud-box {
    background: rgba(10, 20, 50, 0.45);
    backdrop-filter: blur(12px);
    border-radius: 14px;
    padding: 10px 16px;
    border: 1px solid rgba(140, 200, 255, 0.2);
  }
  .hud-label { font-size: 11px; opacity: 0.65; letter-spacing: 2px; }
  .hud-value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  #combo { color: #7fd4ff; transition: transform 0.1s; }
  #combo.bump { transform: scale(1.25); }

  /* 中央开始遮罩 */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,40,90,0.7) 0%, rgba(5,10,30,0.92) 100%);
    transition: opacity 0.4s;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: 42px; font-weight: 800; letter-spacing: 6px;
    background: linear-gradient(135deg, #7fd4ff, #c89bff, #ff9bd2);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  #overlay p { font-size: 14px; opacity: 0.7; margin-bottom: 32px; letter-spacing: 2px; }
  .big-btn {
    border: none; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #4a9eff, #8a5cff);
    padding: 16px 48px; border-radius: 999px; font-size: 18px; font-weight: 600;
    letter-spacing: 3px; box-shadow: 0 8px 32px rgba(90, 140, 255, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .big-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(90, 140, 255, 0.6); }
  .big-btn:active { transform: scale(0.97); }

  /* 底部控制条 */
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 10;
    background: rgba(10, 20, 50, 0.55); backdrop-filter: blur(12px);
    padding: 10px 14px; border-radius: 999px;
    border: 1px solid rgba(140, 200, 255, 0.2);
  }
  .ctrl-btn {
    border: none; cursor: pointer; color: #fff;
    background: rgba(255,255,255,0.12); border-radius: 999px;
    padding: 10px 18px; font-size: 14px; transition: background 0.2s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.25); }
  #trackName { font-size: 12px; opacity: 0.7; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* mute */
  #muteBtn {
    position: fixed; top: 72px; right: 20px; z-index: 10;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(10, 20, 50, 0.55); backdrop-filter: blur(12px);
    border: 1px solid rgba(140, 200, 255, 0.2);
    color: #fff; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
  <a id="backBtn" href="index.html">← 返回游戏</a>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">COMBO</div>
      <div class="hud-value" id="combo">0</div>
    </div>
  </div>

  <button id="muteBtn" title="静音">♪</button>

  <div id="overlay">
    <h1>音乐球</h1>
    <p>上传音乐，让小球跟着鼓点跳起来</p>
    <button class="big-btn" id="startBtn">选择音乐开始</button>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="chooseBtn">换歌</button>
    <button class="ctrl-btn" id="playBtn">播放</button>
    <button class="ctrl-btn" id="pauseBtn">暂停</button>
    <span id="trackName">未选择音乐</span>
  </div>

  <input type="file" id="fileInput" accept="audio/*" hidden />

<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const fileInput = $("fileInput");
  const overlay = $("overlay");
  const startBtn = $("startBtn");
  const chooseBtn = $("chooseBtn");
  const playBtn = $("playBtn");
  const pauseBtn = $("pauseBtn");
  const trackName = $("trackName");
  const scoreEl = $("score");
  const comboEl = $("combo");
  const muteBtn = $("muteBtn");

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ===== 音频系统 =====
  let audioCtx = null, analyser = null, source = null, gainNode = null;
  let freqData = null, timeData = null;
  let audio = null, isPlaying = false, muted = false;
  let bassLevel = 0, midLevel = 0, trebleLevel = 0;
  let lastBassPeak = 0;

  function initAudio(file) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audio) { audio.pause(); audio = null; }
    const url = URL.createObjectURL(file);
    audio = new Audio(url);
    audio.loop = true;
    source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.6;
    source.connect(analyser);
    analyser.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    trackName.textContent = file.name;
  }

  function updateLevels() {
    if (!analyser || !freqData) { bassLevel = midLevel = trebleLevel = 0; return; }
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    // 低频(鼓点): 0-10%
    let b = 0; for (let i = 0; i < n * 0.1; i++) b += freqData[i];
    bassLevel = (b / (n * 0.1)) / 255;
    // 中频: 10-50%
    let m = 0; for (let i = n * 0.1; i < n * 0.5; i++) m += freqData[i];
    midLevel = (m / (n * 0.4)) / 255;
    // 高频: 50-100%
    let t = 0; for (let i = n * 0.5; i < n; i++) t += freqData[i];
    trebleLevel = (t / (n * 0.5)) / 255;
  }

  // ===== 游戏状态 =====
  let score = 0, combo = 0, bestCombo = 0;
  let ball = { x: 0, y: 0, vy: 0, r: 22, baseY: 0, groundY: 0, glow: 20, hue: 200 };
  let particles = [];
  let keys = [];
  let clouds = [];
  let flashAlpha = 0;

  function initScene() {
    ball.x = W / 2;
    ball.groundY = H * 0.72;
    ball.baseY = ball.groundY;
    ball.y = ball.baseY;
    ball.vy = 0;
    // 透视琴键: 从近到远排列
    keys = [];
    const keyCount = 14;
    for (let i = 0; i < keyCount; i++) {
      const t = i / (keyCount - 1); // 0=近, 1=远
      keys.push({
        t,
        y: ball.groundY - t * H * 0.45,
        width: (1 - t) * W * 0.18 + 20,
        height: (1 - t) * 18 + 6,
        hue: 200 + t * 80,
        phase: Math.random() * Math.PI * 2,
        lit: 0
      });
    }
    // 云
    clouds = [];
    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.4,
        r: 60 + Math.random() * 100,
        speed: 0.1 + Math.random() * 0.2,
        alpha: 0.08 + Math.random() * 0.1
      });
    }
    particles = [];
    score = 0; combo = 0; bestCombo = 0;
    scoreEl.textContent = "0";
    comboEl.textContent = "0";
  }

  // ===== 输入事件 =====
  startBtn.addEventListener("click", () => fileInput.click());
  chooseBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    initAudio(f);
    overlay.classList.add("hidden");
    if (audioCtx.state === "suspended") audioCtx.resume();
    audio.play();
    isPlaying = true;
  });
  playBtn.addEventListener("click", () => {
    if (!audio) { fileInput.click(); return; }
    if (audioCtx.state === "suspended") audioCtx.resume();
    audio.play(); isPlaying = true;
  });
  pauseBtn.addEventListener("click", () => {
    if (!audio) return;
    audio.pause(); isPlaying = false;
  });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    if (gainNode) gainNode.gain.linearRampToValueAtTime(muted ? 0 : 0.6, audioCtx.currentTime + 0.05);
    muteBtn.textContent = muted ? "✕" : "♪";
  });

  // ===== 粒子 =====
  function spawnParticles(x, y, power) {
    const count = Math.floor(power * 12) + 3;
    for (let i = 0; i < count; i++) {
      particles.push({
        x, y,
        vx: (Math.random() - 0.5) * (4 + power * 8),
        vy: -Math.random() * (3 + power * 6),
        life: 1,
        size: 2 + Math.random() * 3,
        hue: ball.hue + Math.random() * 60
      });
    }
  }

  // ===== 绘制 =====
  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a1230");
    g.addColorStop(0.5, "#1a2a6a");
    g.addColorStop(1, "#4a6aaa");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 云
    clouds.forEach(c => {
      c.x += c.speed;
      if (c.x - c.r > W) c.x = -c.r;
      const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r);
      cg.addColorStop(0, `rgba(200,220,255,${c.alpha})`);
      cg.addColorStop(1, "rgba(200,220,255,0)");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.r, c.r * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // 远山
    ctx.beginPath();
    ctx.moveTo(0, H * 0.55);
    for (let x = 0; x <= W; x += 30) {
      ctx.lineTo(x, H * 0.55 + Math.sin(x * 0.008) * 25 + Math.cos(x * 0.02) * 10);
    }
    ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
    ctx.fillStyle = "rgba(30,50,100,0.5)";
    ctx.fill();
  }

  function drawKeys() {
    keys.forEach((k, i) => {
      const energy = isPlaying ? bassLevel : 0;
      // 随机亮起来模拟琴键被按
      k.lit = Math.max(0, k.lit - 0.05);
      const wave = Math.sin(Date.now() * 0.004 + k.phase) * 0.5 + 0.5;
      const glow = wave * energy * 1.5;
      const scale = 1 + glow * 0.08;

      ctx.save();
      ctx.translate(k.x || W/2, k.y);
      ctx.translate(W / 2, k.y);
      ctx.scale(scale, scale);
      ctx.fillStyle = `hsla(${k.hue}, 60%, ${30 + glow * 30}%, ${0.7 + k.t * 0.3})`;
      ctx.shadowColor = `hsla(${k.hue}, 80%, 70%, 0.9)`;
      ctx.shadowBlur = glow * 30;
      const kw = k.width, kh = k.height;
      ctx.fillRect(-kw/2, -kh/2, kw, kh);
      ctx.restore();
    });
  }

  function drawBall() {
    if (isPlaying) {
      // 重力
      ball.vy += 0.5;
      ball.y += ball.vy;
      // 落地检测
      if (ball.y >= ball.groundY) {
        ball.y = ball.groundY;
        // 每次落地根据bass强度弹跳
        const power = bassLevel;
        ball.vy = -(5 + power * 15);
        ball.glow = 30 + power * 50;
        // 计分
        combo++;
        bestCombo = Math.max(bestCombo, combo);
        score += Math.floor(10 + power * 50 + combo * 2);
        scoreEl.textContent = score;
        comboEl.textContent = combo;
        comboEl.classList.add("bump");
        setTimeout(() => comboEl.classList.remove("bump"), 100);
        // 粒子
        if (power > 0.25) spawnParticles(ball.x, ball.groundY, power);
        flashAlpha = Math.min(0.3, power * 0.4);
      }
    } else {
      ball.y += (ball.baseY - ball.y) * 0.1;
    }

    ball.glow *= 0.95;
    ball.hue = 200 + midLevel * 120;

    // 地面光晕
    const groundGlow = ctx.createRadialGradient(ball.x, ball.groundY + 2, 0, ball.x, ball.groundY + 2, 80);
    groundGlow.addColorStop(0, `hsla(${ball.hue}, 90%, 70%, ${0.3 + bassLevel * 0.4})`);
    groundGlow.addColorStop(1, `hsla(${ball.hue}, 90%, 70%, 0)`);
    ctx.fillStyle = groundGlow;
    ctx.beginPath();
    ctx.ellipse(ball.x, ball.groundY + 2, 80, 18, 0, 0, Math.PI * 2);
    ctx.fill();

    // 小球
    ctx.save();
    ctx.shadowColor = `hsla(${ball.hue}, 90%, 70%, 1)`;
    ctx.shadowBlur = ball.glow;
    const bg = ctx.createRadialGradient(
      ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, ball.r * 0.1,
      ball.x, ball.y, ball.r
    );
    bg.addColorStop(0, "#ffffff");
    bg.addColorStop(0.3, `hsla(${ball.hue + 40}, 90%, 85%, 1)`);
    bg.addColorStop(0.7, `hsla(${ball.hue}, 80%, 65%, 1)`);
    bg.addColorStop(1, `hsla(${ball.hue - 40}, 70%, 45%, 1)`);
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 闪光
    if (flashAlpha > 0.01) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
      flashAlpha *= 0.85;
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15;
      p.life -= 0.025;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = `hsla(${p.hue}, 90%, 75%, 1)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function loop() {
    updateLevels();
    drawBackground();
    drawKeys();
    drawParticles();
    drawBall();
    requestAnimationFrame(loop);
  }

  initScene();
  loop();
})();
</script>
</body>
</html>
