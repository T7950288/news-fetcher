<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>音乐球</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='35%25' r='65%25'%3E%3Cstop offset='0%25' stop-color='%23ffffff'/%3E%3Cstop offset='50%25' stop-color='%237fd4ff'/%3E%3Cstop offset='100%25' stop-color='%238a5cff'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #070b20; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }

  canvas { display: block; width: 100vw; height: 100vh; }

  /* 顶部 HUD */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 60px 20px 16px; z-index: 10; pointer-events: none;
  }
  .hud-box {
    background: rgba(10, 20, 50, 0.45);
    backdrop-filter: blur(12px);
    border-radius: 14px;
    padding: 10px 16px;
    border: 1px solid rgba(140, 200, 255, 0.2);
  }
  .hud-label { font-size: 11px; opacity: 0.65; letter-spacing: 2px; }
  .hud-value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
  #combo { color: #7fd4ff; transition: transform 0.1s; }
  #combo.bump { transform: scale(1.25); }

  /* 返回按钮 */
  #backBtn {
    position: fixed; top: 12px; left: 12px; z-index: 30;
    border: 1px solid rgba(140,200,255,0.25);
    background: rgba(10,20,50,0.6); backdrop-filter: blur(12px);
    color: #fff; border-radius: 999px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: background 0.2s;
  }
  #backBtn:hover { background: rgba(20,40,80,0.8); }

  /* 中央开始遮罩 */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(20,40,90,0.72) 0%, rgba(5,10,30,0.94) 100%);
    transition: opacity 0.4s;
    text-align: center; padding: 0 24px;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  #overlay h1 {
    font-size: 44px; font-weight: 800; letter-spacing: 8px;
    background: linear-gradient(135deg, #7fd4ff, #c89bff, #ff9bd2, #ffd43b);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 10px;
  }
  #overlay p { font-size: 14px; opacity: 0.7; margin-bottom: 36px; letter-spacing: 2px; line-height: 1.8; }
  .big-btn {
    border: none; cursor: pointer; color: #fff;
    background: linear-gradient(135deg, #4a9eff, #8a5cff);
    padding: 16px 48px; border-radius: 999px; font-size: 18px; font-weight: 600;
    letter-spacing: 3px; box-shadow: 0 8px 32px rgba(90, 140, 255, 0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .big-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(90, 140, 255, 0.6); }
  .big-btn:active { transform: scale(0.97); }

  /* 底部控制条 */
  #controls {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; z-index: 10;
    background: rgba(10, 20, 50, 0.55); backdrop-filter: blur(12px);
    padding: 10px 14px; border-radius: 999px;
    border: 1px solid rgba(140, 200, 255, 0.2);
    max-width: calc(100vw - 24px);
  }
  .ctrl-btn {
    border: none; cursor: pointer; color: #fff;
    background: rgba(255,255,255,0.12); border-radius: 999px;
    padding: 10px 18px; font-size: 14px; transition: background 0.2s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.25); }
  #trackName { font-size: 12px; opacity: 0.7; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* mute */
  #muteBtn {
    position: fixed; top: 72px; right: 20px; z-index: 10;
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(10, 20, 50, 0.55); backdrop-filter: blur(12px);
    border: 1px solid rgba(140, 200, 255, 0.2);
    color: #fff; cursor: pointer; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>
  <a id="backBtn" href="index.html">← 返回游戏</a>
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="hud-box">
      <div class="hud-label">SCORE</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-box" style="text-align:right">
      <div class="hud-label">COMBO</div>
      <div class="hud-value" id="combo">0</div>
    </div>
  </div>

  <button id="muteBtn" title="静音">♪</button>

  <div id="overlay">
    <h1>音乐球</h1>
    <p>上传音乐，彩虹泡泡在 3D 空间里随鼓点舞动</p>
    <button class="big-btn" id="startBtn">选择音乐开始</button>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="chooseBtn">换歌</button>
    <button class="ctrl-btn" id="playBtn">播放</button>
    <button class="ctrl-btn" id="pauseBtn">暂停</button>
    <span id="trackName">未选择音乐</span>
  </div>

  <input type="file" id="fileInput" accept="audio/*" hidden />

<script>
(() => {
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);
  const fileInput = $("fileInput");
  const overlay = $("overlay");
  const startBtn = $("startBtn");
  const chooseBtn = $("chooseBtn");
  const playBtn = $("playBtn");
  const pauseBtn = $("pauseBtn");
  const trackName = $("trackName");
  const scoreEl = $("score");
  const comboEl = $("combo");
  const muteBtn = $("muteBtn");

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ===== 音频系统 =====
  let audioCtx = null, analyser = null, source = null, gainNode = null;
  let freqData = null, timeData = null;
  let audio = null, isPlaying = false, muted = false;
  let bassLevel = 0, midLevel = 0, trebleLevel = 0;

  function initAudio(file) {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audio) { audio.pause(); audio = null; }
    const url = URL.createObjectURL(file);
    audio = new Audio(url);
    audio.loop = true;
    source = audioCtx.createMediaElementSource(audio);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.75;
    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0.6;
    source.connect(analyser);
    analyser.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    freqData = new Uint8Array(analyser.frequencyBinCount);
    timeData = new Uint8Array(analyser.fftSize);
    trackName.textContent = file.name;
  }

  function updateLevels() {
    if (!analyser || !freqData) { bassLevel = midLevel = trebleLevel = 0; return; }
    analyser.getByteFrequencyData(freqData);
    const n = freqData.length;
    let b = 0; for (let i = 0; i < n * 0.1; i++) b += freqData[i];
    bassLevel = (b / (n * 0.1)) / 255;
    let m = 0; for (let i = n * 0.1; i < n * 0.5; i++) m += freqData[i];
    midLevel = (m / (n * 0.4)) / 255;
    let t = 0; for (let i = n * 0.5; i < n; i++) t += freqData[i];
    trebleLevel = (t / (n * 0.5)) / 255;
  }

  // ===== 3D 泡泡球系统 =====
  // 伪 3D：每个球有 (x,y,z)，透视投影 sx = x*F/z, 近大远小、按 z 排序绘制
  const FOCAL = 2.2;          // 透视焦距系数
  let balls = [];
  let particles = [];
  let stars = [];
  let flashAlpha = 0;
  let beatPhase = 0;          // 鼓点相位（驱动跳动）
  let score = 0, combo = 0, bestCombo = 0;
  const BALL_COUNT = 30;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function initScene() {
    // 背景星星
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({ x: Math.random() * W, y: Math.random() * H, r: rand(0.5, 1.8), tw: rand(0.002, 0.01), ph: Math.random() * 6.28 });
    }
    // 泡泡球：分布在锥形空间（z 从近到远）
    balls = [];
    for (let i = 0; i < BALL_COUNT; i++) {
      balls.push({
        x: rand(-1, 1), y: rand(-0.6, 0.8), z: rand(0.35, 1.6),
        baseR: rand(0.05, 0.16),
        hue: rand(0, 360),
        phase: Math.random() * 6.28,
        speed: rand(0.6, 1.4),
        bob: 0, puls: 0, seed: Math.random() * 100
      });
    }
    particles = [];
    score = 0; combo = 0; bestCombo = 0;
    scoreEl.textContent = "0";
    comboEl.textContent = "0";
  }

  // 透视投影
  function project(px, py, pz) {
    const k = FOCAL / pz;
    const sx = px * W * 0.4 * k + W / 2;
    const sy = py * H * 0.42 * k + H * 0.56;
    return { sx: sx, sy: sy, k: k };
  }

  // ===== 输入事件 =====
  startBtn.addEventListener("click", () => fileInput.click());
  chooseBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    initAudio(f);
    overlay.classList.add("hidden");
    if (audioCtx.state === "suspended") audioCtx.resume();
    audio.play();
    isPlaying = true;
  });
  playBtn.addEventListener("click", () => {
    if (!audio) { fileInput.click(); return; }
    if (audioCtx.state === "suspended") audioCtx.resume();
    audio.play(); isPlaying = true;
  });
  pauseBtn.addEventListener("click", () => {
    if (!audio) return;
    audio.pause(); isPlaying = false;
  });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    if (gainNode) gainNode.gain.linearRampToValueAtTime(muted ? 0 : 0.6, audioCtx.currentTime + 0.05);
    muteBtn.textContent = muted ? "✕" : "♪";
  });

  // ===== 粒子 =====
  function spawnParticles(x, y, power) {
    const count = Math.floor(power * 10) + 3;
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * (3 + power * 7),
        vy: -Math.random() * (3 + power * 5),
        life: 1,
        size: rand(1.5, 4),
        hue: rand(0, 360)
      });
    }
  }

  // ===== 绘制 =====
  function drawBackground(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#070b20");
    g.addColorStop(0.5, "#131b4a");
    g.addColorStop(1, "#2a1e6e");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 星星
    ctx.save();
    stars.forEach(s => {
      const a = 0.35 + 0.4 * Math.sin(t * s.tw * 100 + s.ph);
      ctx.globalAlpha = a;
      ctx.fillStyle = "#cfd8ff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.28);
      ctx.fill();
    });
    ctx.restore();
  }

  function drawBalls() {
    // 更新并排序（远→近）
    const beat = isPlaying ? Math.pow(bassLevel, 1.4) : 0;
    beatPhase += 0.05;
    const sorted = balls.slice().sort((a, b) => b.z - a.z);
    sorted.forEach(b => {
      // 鼓点跳动：bass 驱动 y 上跳 + 半径膨胀
      const bounce = beat * (0.5 + 0.5 * Math.sin(b.phase + b.seed));
      const puls = 1 + beat * 0.7 * (0.5 + 0.5 * Math.sin(beatPhase * b.speed + b.seed));
      // 中频轻摇
      const sway = midLevel * 0.12 * Math.sin(beatPhase * 0.8 * b.speed + b.seed);
      const x = b.x + sway;
      const y = b.y - bounce * 0.55;
      const z = b.z;

      const p = project(x, y, z);
      const r = Math.max(3, b.baseR * p.k * 320 * puls);
      // 鼓点强时亮色偏移
      const hue = (b.hue + trebleLevel * 60) % 360;
      const bright = 55 + beat * 40 + midLevel * 15;

      ctx.save();
      ctx.globalAlpha = Math.min(0.95, 0.45 + (1.2 - z) * 0.5);
      ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.9)`;
      ctx.shadowBlur = r * (0.6 + beat * 1.6);
      // 球体：左上高光径向渐变（彩虹泡泡）
      const hg = ctx.createRadialGradient(p.sx - r * 0.35, p.sy - r * 0.4, r * 0.1, p.sx, p.sy, r);
      hg.addColorStop(0, "#ffffff");
      hg.addColorStop(0.25, `hsla(${(hue + 40) % 360}, 95%, ${bright + 25}%, 1)`);
      hg.addColorStop(0.7, `hsla(${hue}, 85%, ${bright}%, 1)`);
      hg.addColorStop(1, `hsla(${(hue - 45 + 360) % 360}, 80%, ${Math.max(20, bright - 30)}%, 1)`);
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(p.sx, p.sy, r, 0, 6.28);
      ctx.fill();
      // 高光点
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(p.sx - r * 0.3, p.sy - r * 0.35, Math.max(1.2, r * 0.16), 0, 6.28);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawKeys(t) {
    // 底部 3D 透视琴键
    const n = 16;
    const beat = isPlaying ? bassLevel : 0;
    for (let i = 0; i < n; i++) {
      const tt = i / (n - 1);
      const yBase = H * 0.86;
      const y = yBase - tt * H * 0.06;
      const kw = (1 - tt * 0.5) * (W / n) * 1.6;
      const wave = Math.sin(t * 0.004 + i * 0.7) * 0.5 + 0.5;
      const glow = wave * beat * 1.6;
      const hue = 200 + tt * 120 + glow * 40;
      ctx.save();
      ctx.fillStyle = `hsla(${hue}, 60%, ${26 + glow * 30}%, ${0.5 + tt * 0.35})`;
      ctx.shadowColor = `hsla(${hue}, 85%, 70%, 0.8)`;
      ctx.shadowBlur = glow * 24;
      ctx.fillRect(i * (W / n), y, kw, 4 + tt * 8);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.14;
      p.life -= 0.024;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = `hsla(${p.hue}, 90%, 75%, 1)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life + 0.5, 0, 6.28);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawFlash() {
    if (flashAlpha > 0.01) {
      ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.fillRect(0, 0, W, H);
      flashAlpha *= 0.85;
    }
  }

  // 鼓点计分：bass 峰值时刻
  function beatScoring() {
    if (!isPlaying) return;
    if (bassLevel > 0.5 && flashAlpha < 0.15) {
      flashAlpha = Math.min(0.28, bassLevel * 0.35);
      combo++;
      bestCombo = Math.max(bestCombo, combo);
      score += Math.floor(10 + bassLevel * 60 + combo * 2);
      scoreEl.textContent = score;
      comboEl.textContent = combo;
      comboEl.classList.add("bump");
      setTimeout(() => comboEl.classList.remove("bump"), 100);
      // 从底部喷射彩虹粒子
      for (let i = 0; i < 2; i++) {
        spawnParticles(W / 2 + rand(-W * 0.3, W * 0.3), H * 0.85, bassLevel);
      }
    } else if (bassLevel < 0.2 && combo > 0) {
      combo = 0;
      comboEl.textContent = "0";
    }
  }

  function loop(now) {
    const t = now || performance.now();
    updateLevels();
    beatScoring();
    drawBackground(t);
    drawBalls();
    drawParticles();
    drawKeys(t);
    drawFlash();
    requestAnimationFrame(loop);
  }

  initScene();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
