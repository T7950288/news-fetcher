<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音乐球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#070b1a; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#fff; user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #back {
    position:fixed; left:14px; top:12px; z-index:30;
    background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.25); border-radius:20px;
    padding:8px 16px; font-size:15px; cursor:pointer; line-height:1;
  }
  #back:active { background:rgba(255,255,255,.32); }

  #title {
    position:fixed; left:50%; top:4%; transform:translateX(-50%); z-index:30;
    text-align:center; pointer-events:none;
  }
  #title h1 { font-size:min(8vw,36px); font-weight:800; letter-spacing:8px;
    color:#fff; text-shadow:0 2px 12px rgba(80,140,255,.5); }
  #title p { margin-top:5px; font-size:min(3.1vw,13px); color:rgba(255,255,255,.7); letter-spacing:1px; }

  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(ellipse at center, rgba(30,50,110,.35) 0%, rgba(5,9,24,.88) 100%);
    transition:opacity .45s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }

  #pickBtn {
    background:linear-gradient(135deg,#2f7bff,#5b4dff); color:#fff;
    border:none; border-radius:30px; padding:15px 38px;
    font-size:min(4.5vw,18px); font-weight:700; letter-spacing:2px; cursor:pointer;
    box-shadow:0 6px 22px rgba(60,110,255,.45);
  }
  #pickBtn:active { transform:scale(.96); }
  #hint { font-size:min(3.4vw,14px); color:rgba(255,255,255,.8); text-align:center; line-height:1.9; }

  #ctrl {
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:8px; white-space:nowrap; flex-wrap:wrap; justify-content:center;
    max-width:96vw;
  }
  .cb {
    background:rgba(255,255,255,.14); color:#fff;
    border:1px solid rgba(255,255,255,.28); border-radius:20px;
    padding:9px 16px; font-size:13px; cursor:pointer; letter-spacing:1px; line-height:1;
  }
  .cb:active { background:rgba(255,255,255,.34); }
  .cb:disabled { opacity:.4; cursor:default; }
  #st { font-size:12px; color:rgba(255,255,255,.6); padding:0 4px; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="back">返回游戏</div>

<div id="title">
  <h1>音乐球</h1>
  <p>小球落键 · 歌词跟唱</p>
</div>

<div id="overlay">
  <button id="pickBtn">选择音乐开始</button>
  <div id="hint">支持 MP3 / M4A / WAV 等音频<br>可选 .lrc 歌词文件，播放时同步滚动跟唱</div>
</div>

<div id="ctrl">
  <button class="cb" id="lyricBtn" disabled>歌词</button>
  <button class="cb" id="swapBtn" disabled>换歌</button>
  <button class="cb" id="playBtn" disabled>播放</button>
  <button class="cb" id="pauseBtn" disabled>暂停</button>
  <span id="st">未选择音乐</span>
</div>

<input type="file" id="file" accept="audio/*" style="display:none">
<input type="file" id="lrcFile" accept=".lrc,.txt" style="display:none">

<script>
(function () {
  "use strict";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1;
  var rand = Math.random;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  /* ========== 音频 ========== */
  var audio = null, audioCtx = null, analyser = null, srcNode = null;
  var freq = null;
  var isPlaying = false;
  var songName = "音乐球";

  var fileInput = document.getElementById("file");
  var lrcInput = document.getElementById("lrcFile");
  var pickBtn = document.getElementById("pickBtn");
  var overlay = document.getElementById("overlay");
  var swapBtn = document.getElementById("swapBtn");
  var playBtn = document.getElementById("playBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var lyricBtn = document.getElementById("lyricBtn");
  var st = document.getElementById("st");

  /* ========== LRC 歌词 ========== */
  var lyrics = [];          // [{t: 秒, text: 行}]
  var lyricName = "";

  function parseLRC(text) {
    var lines = text.split(/\r?\n/);
    var out = [];
    var tagRe = /\[(\d{1,2}):(\d{1,2})(?:[.:](\d{1,3}))?\]/g;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var times = [];
      var m;
      tagRe.lastIndex = 0;
      while ((m = tagRe.exec(line)) !== null) {
        var min = parseInt(m[1], 10);
        var sec = parseInt(m[2], 10);
        var frac = m[3] ? parseFloat("0." + m[3]) : 0;
        times.push(min * 60 + sec + frac);
      }
      if (times.length === 0) continue;
      var text = line.replace(tagRe, "").trim();
      if (!text) continue;
      for (var j = 0; j < times.length; j++) out.push({ t: times[j], text: text });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function currentLyricIdx() {
    if (!audio || lyrics.length === 0) return -1;
    var t = audio.currentTime || 0;
    var idx = -1;
    for (var i = 0; i < lyrics.length; i++) {
      if (lyrics[i].t <= t + 0.3) idx = i;
      else break;
    }
    return idx;
  }

  lrcInput.addEventListener("change", function () {
    var f = lrcInput.files && lrcInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function (e) {
      var parsed = parseLRC(String(e.target.result || ""));
      if (parsed.length > 0) {
        lyrics = parsed;
        lyricName = f.name;
        st.textContent = "歌词已加载 · " + lyricName;
      } else {
        lyrics = [];
        lyricName = "";
        st.textContent = "歌词文件没有时间标签，请用 .lrc 格式";
      }
    };
    reader.readAsText(f, "utf-8");
  });

  function cleanName(n) {
    n = n.replace(/\.[^.]+$/, "");
    n = n.replace(/[_\-]+/g, " ");
    return n.trim() || "未命名歌曲";
  }

  function loadAudio(file) {
    if (!file) return;
    songName = cleanName(file.name);
    var url = URL.createObjectURL(file);
    if (!audio) {
      audio = new Audio();
      audio.preload = "auto";
      audio.loop = true;
      audio.volume = 1.0;
    }
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    audio.src = url;
    audio.oncanplaythrough = function () {
      if (audioCtx) {
        if (!srcNode) {
          srcNode = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          var gainNode = audioCtx.createGain();
          gainNode.gain.value = 1.5;
          srcNode.connect(analyser);
          analyser.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          freq = new Uint8Array(analyser.frequencyBinCount);
        }
        audioCtx.resume && audioCtx.resume();
      }
      startPlay();
    };
    audio.onerror = function () { st.textContent = "音频加载失败，请换一首"; };
  }

  function startPlay() {
    audio.play();
    isPlaying = true;
    swapBtn.disabled = false;
    lyricBtn.disabled = false;
    playBtn.disabled = true;
    pauseBtn.disabled = false;
    st.textContent = "播放中 · " + songName + (lyrics.length ? "（歌词 " + lyricName + "）" : "（未加载歌词，点「歌词」可加载 .lrc）");
    overlay.classList.add("hidden");
  }

  pickBtn.addEventListener("click", function () { fileInput.click(); });
  swapBtn.addEventListener("click", function () { fileInput.click(); });
  lyricBtn.addEventListener("click", function () { lrcInput.click(); });
  playBtn.addEventListener("click", function () {
    if (!audio) return;
    audio.play();
    isPlaying = true;
    playBtn.disabled = true; pauseBtn.disabled = false;
    st.textContent = "播放中 · " + songName;
  });
  pauseBtn.addEventListener("click", function () {
    if (!audio) return;
    audio.pause();
    isPlaying = false;
    playBtn.disabled = false; pauseBtn.disabled = true;
    st.textContent = "已暂停";
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) loadAudio(fileInput.files[0]);
  });

  /* ========== 钢琴键布局 ========== */
  var WHITE_N = 14;
  var keyTop = 0, keyBottom = 0, keyW = 0, keyH = 0, keyX0 = 0;
  var flash = [], press = [];
  for (var ki = 0; ki < WHITE_N; ki++) { flash.push(0); press.push(0); }

  function layoutKeys() {
    keyH = Math.max(80, Math.round(H * 0.18));
    keyTop = H - keyH - 62;
    keyBottom = keyTop + keyH;
    keyW = Math.floor((W - 24) / WHITE_N);
    keyX0 = Math.floor((W - keyW * WHITE_N) / 2);
  }
  layoutKeys();
  window.addEventListener("resize", layoutKeys);

  var blackAfter = [2, 4, 7, 9, 11];
  var blackKeys = [];
  function layoutBlacks() {
    blackKeys = [];
    for (var i = 0; i < blackAfter.length; i++) {
      var b = blackAfter[i];
      blackKeys.push({ x: keyX0 + (b + 1) * keyW - keyW * 0.34, w: keyW * 0.62, h: keyH * 0.58, y: keyTop - keyH * 0.58 + keyH * 0.22 });
    }
  }
  layoutBlacks();
  window.addEventListener("resize", layoutBlacks);

  /* ========== 节奏小球（一粒，随音乐跳动） ========== */
  var ball = { x: 0, y: 0, r: 26, vy: 0, squash: 0, glow: 0 };

  function layoutBall() {
    ball.x = W / 2;
    ball.r = Math.max(20, Math.min(W * 0.055, H * 0.045));
    ball.y = keyTop - ball.r;
  }
  layoutBall();
  window.addEventListener("resize", layoutBall);

  function updateOneBall(bass) {
    // 节奏强 → 跳得高；节奏弱 → 落回琴键
    var jumpH = bass * (H * 0.20);
    var targetY = keyTop - ball.r - jumpH;
    ball.vy += (targetY - ball.y) * 0.07;
    ball.vy *= 0.58;
    ball.y += ball.vy;
    if (ball.y > keyTop - ball.r) {
      ball.y = keyTop - ball.r;
      ball.vy = 0;
    }
    // 落键瞬间：琴键发光 + 球体压扁
    var onKey = ball.y >= keyTop - ball.r - 1.5 && ball.vy <= 0.5;
    if (onKey && bass > 0.02) {
      var idx = Math.floor((ball.x - keyX0) / keyW);
      if (idx >= 0 && idx < WHITE_N) {
        flash[idx] = Math.min(1, flash[idx] + 0.35);
        press[idx] = Math.min(1, press[idx] + 0.3);
      }
      ball.squash = Math.min(0.32, ball.squash + 0.12);
      ball.glow = Math.min(1, ball.glow + 0.28);
    }
    ball.squash *= 0.86;
    ball.glow *= 0.9;
  }

  function drawOneBall(bass) {
    var r = ball.r;
    var sq = ball.squash;
    var rx = r * (1 + sq * 0.5);
    var ry = r * (1 - sq * 0.32);
    var yc = ball.y + sq * r * 0.3;
    // 光晕（透明径向渐变，不用 shadowBlur）
    if (ball.glow > 0.03) {
      var hg = ctx.createRadialGradient(ball.x, yc, r * 0.4, ball.x, yc, r * 2.2);
      hg.addColorStop(0, "hsla(210,100%,72%," + (ball.glow * 0.28).toFixed(3) + ")");
      hg.addColorStop(1, "hsla(210,100%,72%,0)");
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(ball.x, yc, r * 2.2, 0, 6.2832);
      ctx.fill();
    }
    // 金属质感球体
    var g = ctx.createRadialGradient(ball.x - rx * 0.3, yc - ry * 0.38, rx * 0.12, ball.x, yc, rx);
    g.addColorStop(0, "hsla(210,40%,94%,1)");
    g.addColorStop(0.5, "hsla(210,45%,66%,1)");
    g.addColorStop(1, "hsla(215,55%,34%,1)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(ball.x, yc, rx, ry, 0, 0, 6.2832);
    ctx.fill();
    // 高光点
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.ellipse(ball.x - rx * 0.32, yc - ry * 0.4, rx * 0.2, ry * 0.15, -0.5, 0, 6.2832);
    ctx.fill();
    // 底部反光
    ctx.fillStyle = "rgba(255,255,255,0.16)";
    ctx.beginPath();
    ctx.ellipse(ball.x + rx * 0.3, yc + ry * 0.5, rx * 0.4, ry * 0.11, 0.3, 0, 6.2832);
    ctx.fill();
  }

  /* ========== 背景 ========== */
  function drawBackground(time) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0a1230");
    g.addColorStop(0.6, "#0a0e24");
    g.addColorStop(1, "#070a18");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    var starN = 70;
    for (var i = 0; i < starN; i++) {
      var sx = ((i * 61) % 100) / 100 * W;
      var sy = ((i * 37) % 100) / 100 * H * 0.7;
      var tw = 0.3 + 0.7 * Math.abs(Math.sin(time * 0.0011 + i * 1.7));
      ctx.fillStyle = "rgba(255,255,255," + (0.2 * tw).toFixed(3) + ")";
      ctx.fillRect(sx, sy, 2, 2);
    }
  }

  /* ========== 钢琴键 ========== */
  function drawKeyboard(time, bass) {
    var keyLift = Math.max(0, bass) * 4;
    for (var i = 0; i < WHITE_N; i++) {
      var px = keyX0 + i * keyW;
      var py = keyTop + keyLift + press[i] * 3;
      var fl = flash[i];
      ctx.fillStyle = "#5a6474";
      ctx.beginPath();
      ctx.moveTo(px, py + keyH - 14);
      ctx.lineTo(px + keyW, py + keyH - 14);
      ctx.lineTo(px + keyW, py + keyH);
      ctx.lineTo(px, py + keyH);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#3c4454";
      ctx.beginPath();
      ctx.moveTo(px, py + keyH - 6);
      ctx.lineTo(px + keyW, py + keyH - 6);
      ctx.lineTo(px + keyW, py + keyH - 14);
      ctx.lineTo(px, py + keyH - 14);
      ctx.closePath();
      ctx.fill();
      var lit = 0.10 + fl * 0.75 + bass * 0.18;
      if (lit > 0.95) lit = 0.95;
      var fg = ctx.createLinearGradient(0, py, 0, py + keyH - 14);
      fg.addColorStop(0, "hsla(215,25%," + Math.round(92 + lit * 8) + "%,1)");
      fg.addColorStop(0.7, "hsla(215,20%," + Math.round(86 + lit * 8) + "%,1)");
      fg.addColorStop(1, "hsla(215,22%," + Math.round(72 + lit * 10) + "%,1)");
      ctx.fillStyle = fg;
      ctx.beginPath();
      ctx.rect(px, py, keyW, keyH - 14);
      ctx.fill();
      ctx.fillStyle = "rgba(40,50,70,0.8)";
      ctx.fillRect(px, py, Math.max(1, keyW * 0.05), keyH - 14);
      if (fl > 0.03) {
        ctx.fillStyle = "hsla(210,100%," + Math.round(60 + lit * 30) + "%," + (fl * 0.22).toFixed(3) + ")";
        ctx.beginPath();
        ctx.rect(px - 2, py - 2, keyW + 4, keyH - 10);
        ctx.fill();
      }
    }
    for (var j = 0; j < blackKeys.length; j++) {
      var bk = blackKeys[j];
      ctx.fillStyle = "#181c28";
      ctx.beginPath();
      ctx.rect(bk.x, bk.y + keyLift * 0.5, bk.w, bk.h);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.14)";
      ctx.fillRect(bk.x + bk.w * 0.12, bk.y + keyLift * 0.5 + 2, bk.w * 0.2, bk.h * 0.5);
    }
    ctx.fillStyle = "#232a3a";
    ctx.fillRect(keyX0 - 6, keyBottom, keyW * WHITE_N + 12, 12);
  }

  /* ========== KTV 歌词滚动 ========== */
  function drawLyrics(time, bass) {
    var idx = currentLyricIdx();
    var cx = W / 2;
    var cy0 = keyTop - 215;                 // 歌词区中心基线
    var mainFs = Math.max(22, Math.round(Math.min(W * 0.052, H * 0.055)));
    var subFs = Math.max(14, Math.round(mainFs * 0.62));

    // 底条
    ctx.fillStyle = "rgba(8,13,30,0.5)";
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx - W * 0.34, cy0 - mainFs * 1.3, W * 0.68, mainFs * 3.1, 16) : ctx.rect(cx - W * 0.34, cy0 - mainFs * 1.3, W * 0.68, mainFs * 3.1);
    ctx.fill();

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    if (idx < 0) {
      // 未到歌词或没有歌词
      var msg = lyrics.length ? "" : (isPlaying ? "未加载歌词 · 点下方「歌词」选 .lrc 文件" : "选择音乐，看小球从天空落下");
      if (!msg && lyrics.length) msg = "♪ " + songName + " ♪";
      ctx.font = "bold " + mainFs + "px 'Microsoft YaHei',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.92)";
      ctx.fillText(msg, cx, cy0);
      return;
    }

    // 前一行（小字）
    if (idx - 1 >= 0) {
      ctx.font = subFs + "px 'Microsoft YaHei',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillText(lyrics[idx - 1].text, cx, cy0 - mainFs * 0.92);
    }
    // 当前行（大字高亮，随鼓点微放大）
    var scale = 1 + bass * 0.05;
    ctx.font = "bold " + Math.round(mainFs * scale) + "px 'Microsoft YaHei',sans-serif";
    ctx.fillStyle = "#ffffff";
    ctx.fillText(lyrics[idx].text, cx, cy0 + mainFs * 0.1);
    // 后一行（小字）
    if (idx + 1 < lyrics.length) {
      ctx.font = subFs + "px 'Microsoft YaHei',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      ctx.fillText(lyrics[idx + 1].text, cx, cy0 + mainFs * 1.1);
    }
  }

  /* ========== 主循环 ========== */
  var lastT = 0;
  var bassSm = 0, midSm = 0, highSm = 0;

  function loop(t) {
    var dt = Math.min(50, t - lastT || 16);
    lastT = t;

    var bass = 0, mid = 0, high = 0;
    if (isPlaying && analyser && freq) {
      analyser.getByteFrequencyData(freq);
      for (var i = 0; i < 16; i++) bass += freq[i];
      for (var i = 16; i < 60; i++) mid += freq[i];
      for (var i = 60; i < 140; i++) high += freq[i];
      bass = bass / (16 * 255);
      mid = mid / (44 * 255);
      high = high / (80 * 255);
      bass = Math.pow(bass, 1.35);
    }
    bassSm += (bass - bassSm) * 0.24;
    midSm += (mid - midSm) * 0.28;
    highSm += (high - highSm) * 0.28;

    drawBackground(t);
    updateOneBall(bassSm);
    drawOneBall(bassSm);
    drawKeyboard(t, bassSm);
    drawLyrics(t, bassSm);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1) history.back();
    else location.href = "index.html";
  });
})();
</script>
</body>
</html>
