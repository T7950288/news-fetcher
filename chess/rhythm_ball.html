<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>音乐球</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#9fd3f2; font-family:"Microsoft YaHei","PingFang SC",sans-serif; color:#fff; user-select:none; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; }

  #back {
    position:fixed; left:14px; top:12px; z-index:30;
    background:rgba(20,40,80,.35); color:#fff;
    border:1px solid rgba(255,255,255,.4); border-radius:20px;
    padding:8px 16px; font-size:15px; cursor:pointer; line-height:1;
  }
  #back:active { background:rgba(20,40,80,.6); }

  #title {
    position:fixed; left:50%; top:4.5%; transform:translateX(-50%); z-index:30;
    text-align:center; pointer-events:none;
  }
  #title h1 { font-size:min(8vw,38px); font-weight:800; letter-spacing:8px;
    color:#fff; text-shadow:0 2px 10px rgba(30,70,140,.45); }
  #title p { margin-top:6px; font-size:min(3.2vw,13px); color:rgba(255,255,255,.92);
    text-shadow:0 1px 6px rgba(30,70,140,.4); letter-spacing:1px; }

  #overlay {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(ellipse at center, rgba(120,180,230,.10) 0%, rgba(40,90,160,.30) 100%);
    transition:opacity .45s;
  }
  #overlay.hidden { opacity:0; pointer-events:none; }

  #pickBtn {
    background:linear-gradient(135deg,#2f7bff,#5b4dff); color:#fff;
    border:none; border-radius:30px; padding:15px 38px;
    font-size:min(4.5vw,18px); font-weight:700; letter-spacing:2px; cursor:pointer;
    box-shadow:0 6px 22px rgba(40,90,200,.45);
  }
  #pickBtn:active { transform:scale(.96); }
  #hint { font-size:min(3.4vw,14px); color:rgba(255,255,255,.95); text-align:center; line-height:1.9;
    text-shadow:0 1px 5px rgba(20,50,110,.5); }

  #ctrl {
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:10px; white-space:nowrap;
  }
  .cb {
    background:rgba(20,50,110,.35); color:#fff;
    border:1px solid rgba(255,255,255,.45); border-radius:22px;
    padding:10px 20px; font-size:14px; cursor:pointer; letter-spacing:1px; line-height:1;
  }
  .cb:active { background:rgba(20,50,110,.6); }
  .cb:disabled { opacity:.4; cursor:default; }
  #st { font-size:12px; color:rgba(255,255,255,.9); padding:0 4px; text-shadow:0 1px 4px rgba(20,50,110,.5); }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="back">返回游戏</div>

<div id="title">
  <h1>音乐球</h1>
  <p>3D 琴键随鼓点舞动</p>
</div>

<div id="overlay">
  <button id="pickBtn">选择音乐开始</button>
  <div id="hint">支持 MP3 / M4A / WAV 等常见音频<br>选一首你喜欢的歌，看琴键和泡泡跳舞</div>
</div>

<div id="ctrl">
  <button class="cb" id="swapBtn" disabled>换歌</button>
  <button class="cb" id="playBtn" disabled>播放</button>
  <button class="cb" id="pauseBtn" disabled>暂停</button>
  <span id="st">未选择音乐</span>
</div>

<input type="file" id="file" accept="audio/*" style="display:none">

<script>
(function () {
  "use strict";

  /* ========== 基础 ========== */
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.max(1, Math.round(W * DPR));
    cv.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  var rand = Math.random;

  /* ========== 泡泡（彩虹球，围绕琴键） ========== */
  var balls = [];
  for (var i = 0; i < 22; i++) {
    balls.push({
      x: rand() * 0.9 + 0.05,      // 横向 0.05~0.95（比例）
      y: 0.12 + rand() * 0.55,     // 纵向 0.12~0.67（上部与琴键间）
      z: 0.8 + rand() * 1.2,
      baseR: 0.05 + rand() * 0.1,
      hue: rand() * 360,
      speed: 0.6 + rand() * 0.9,
      seed: rand() * 100,
      vx: (rand() - 0.5) * 0.00012,
      vy: (rand() - 0.5) * 0.00008
    });
  }

  /* ========== 3D 琴键（错落摆放） ========== */
  // 7 个白键：x,y 为画面比例中心；w 键宽比；h 键高比；rot 小角度；depth 厚度
  var keys = [];
  var notes = ["do", "re", "mi", "fa", "sol", "la", "si"];
  var layout = [
    { x: 0.30, y: 0.78, w: 0.135, h: 0.30, rot: -0.07, d: 0.16 },
    { x: 0.48, y: 0.60, w: 0.155, h: 0.34, rot: 0.03,  d: 0.20 },
    { x: 0.66, y: 0.80, w: 0.125, h: 0.28, rot: 0.08,  d: 0.15 },
    { x: 0.17, y: 0.52, w: 0.120, h: 0.26, rot: -0.12, d: 0.14 },
    { x: 0.84, y: 0.55, w: 0.130, h: 0.28, rot: 0.12,  d: 0.15 },
    { x: 0.36, y: 0.38, w: 0.110, h: 0.24, rot: -0.05, d: 0.13 },
    { x: 0.62, y: 0.36, w: 0.115, h: 0.25, rot: 0.06,  d: 0.13 }
  ];
  for (var k = 0; k < layout.length; k++) {
    keys.push({
      x: layout[k].x, y: layout[k].y, w: layout[k].w, h: layout[k].h,
      rot: layout[k].rot, d: layout[k].d,
      note: notes[k], hue: (k / layout.length) * 360,
      seed: rand() * 100
    });
  }

  /* ========== 云朵 ========== */
  var clouds = [];
  for (var c = 0; c < 5; c++) {
    clouds.push({
      x: rand() * 1.2 - 0.1, y: 0.06 + rand() * 0.3,
      s: 0.5 + rand() * 1.0, v: 0.00004 + rand() * 0.00006
    });
  }

  /* ========== 音频 ========== */
  var audio = null, audioCtx = null, analyser = null, srcNode = null;
  var freq = null;
  var isPlaying = false;
  var fileName = "";

  var fileInput = document.getElementById("file");
  var pickBtn = document.getElementById("pickBtn");
  var overlay = document.getElementById("overlay");
  var swapBtn = document.getElementById("swapBtn");
  var playBtn = document.getElementById("playBtn");
  var pauseBtn = document.getElementById("pauseBtn");
  var st = document.getElementById("st");

  function loadAudio(file) {
    if (!file) return;
    fileName = file.name;
    var url = URL.createObjectURL(file);
    if (!audio) {
      audio = new Audio();
      audio.preload = "auto";
      audio.loop = true;
    }
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    audio.src = url;
    audio.oncanplaythrough = function () {
      if (audioCtx) {
        if (!srcNode) {
          srcNode = audioCtx.createMediaElementSource(audio);
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 512;
          srcNode.connect(analyser);
          analyser.connect(audioCtx.destination);
          freq = new Uint8Array(analyser.frequencyBinCount);
        }
        audioCtx.resume && audioCtx.resume();
      }
      startPlay();
    };
    audio.onerror = function () { st.textContent = "音频加载失败，请换一首"; };
  }

  function startPlay() {
    audio.play();
    isPlaying = true;
    swapBtn.disabled = false;
    playBtn.disabled = true;
    pauseBtn.disabled = false;
    st.textContent = "播放中";
    overlay.classList.add("hidden");
  }

  pickBtn.addEventListener("click", function () { fileInput.click(); });
  swapBtn.addEventListener("click", function () { fileInput.click(); });
  playBtn.addEventListener("click", function () {
    if (!audio) return;
    audio.play();
    isPlaying = true;
    playBtn.disabled = true; pauseBtn.disabled = false;
    st.textContent = "播放中";
  });
  pauseBtn.addEventListener("click", function () {
    if (!audio) return;
    audio.pause();
    isPlaying = false;
    playBtn.disabled = false; pauseBtn.disabled = true;
    st.textContent = "已暂停";
  });
  fileInput.addEventListener("change", function () {
    if (fileInput.files && fileInput.files[0]) loadAudio(fileInput.files[0]);
  });

  /* ========== 渲染：天空 + 云 ========== */
  function drawSky(time) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#8ecbf2");
    g.addColorStop(0.55, "#bfe3f8");
    g.addColorStop(1, "#e8f6fe");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 云朵
    for (var i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      cl.x += cl.v * 16;
      if (cl.x > 1.25) cl.x = -0.25;
      var cx = cl.x * W;
      var cy = cl.y * H;
      var s = cl.s * Math.min(W, H) * 0.0011;
      ctx.fillStyle = "rgba(255,255,255,0.75)";
      ctx.beginPath();
      ctx.ellipse(cx, cy, 90 * s, 32 * s, 0, 0, 6.2832);
      ctx.ellipse(cx - 60 * s, cy + 12 * s, 55 * s, 24 * s, 0, 0, 6.2832);
      ctx.ellipse(cx + 62 * s, cy + 10 * s, 60 * s, 26 * s, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 26 * s, 90 * s, 18 * s, 0, 0, 6.2832);
      ctx.fill();
    }
  }

  /* ========== 渲染：3D 琴键 ========== */
  function drawKey(k, time, bass, mid, idx) {
    var bounce = bass * (0.5 + 0.5 * Math.sin(time * 0.008 + k.seed));
    var jump = Math.max(0, bounce) * 60;         // 鼓点弹跳（px）
    var pulse = 1 + Math.max(0, bass) * 0.10;    // 放大脉冲
    var sway = mid * 0.04 * Math.sin(time * 0.004 + k.seed * 3);
    var idle = isPlaying ? 0 : 0.010 * Math.sin(time * 0.0015 + k.seed * 5);

    var cx = (k.x + sway) * W;
    var cy = (k.y - 0.06 * bounce - idle) * H;
    var w = k.w * W * pulse;
    var h = k.h * H * pulse;
    var depth = k.d * H * pulse;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(k.rot + sway * 0.4);

    // —— 侧面（厚度，立体感）——
    ctx.fillStyle = "#7c8694";
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.lineTo(w / 2, 0);
    ctx.lineTo(w / 2 + depth * 0.35, depth);
    ctx.lineTo(-w / 2 + depth * 0.35, depth);
    ctx.closePath();
    ctx.fill();

    // —— 底面阴影面（更立体）——
    ctx.fillStyle = "#9aa4b0";
    ctx.beginPath();
    ctx.moveTo(-w / 2, 0);
    ctx.lineTo(-w / 2 + depth * 0.35, depth);
    ctx.lineTo(-w / 2 + depth * 0.35 + w, depth);
    ctx.lineTo(w / 2, 0);
    ctx.closePath();
    ctx.fill();

    // —— 正面（白色渐变 + 顶部亮条）——
    var lit = 0.15 + Math.max(0, bass) * 0.5 + mid * 0.15;
    if (lit > 0.9) lit = 0.9;
    var fg = ctx.createLinearGradient(0, -h, 0, 0);
    fg.addColorStop(0, "#ffffff");
    fg.addColorStop(0.7, "#f2f6fb");
    fg.addColorStop(1, "#dbe3ee");
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-w / 2, -h);
    ctx.lineTo(w / 2, -h);
    ctx.lineTo(w / 2, 0);
    ctx.lineTo(-w / 2, 0);
    ctx.closePath();
    ctx.fill();

    // 键缝（左右细线）
    ctx.strokeStyle = "rgba(120,135,155,0.55)";
    ctx.lineWidth = Math.max(1, w * 0.018);
    ctx.beginPath();
    ctx.moveTo(-w / 2, -h); ctx.lineTo(-w / 2, 0);
    ctx.moveTo(w / 2, -h); ctx.lineTo(w / 2, 0);
    ctx.stroke();

    // 发光描边（模拟光效，不用阴影）
    ctx.strokeStyle = "rgba(120,190,255," + (0.25 + lit * 0.55).toFixed(3) + ")";
    ctx.lineWidth = Math.max(2, w * 0.03);
    ctx.beginPath();
    ctx.moveTo(-w / 2, -h); ctx.lineTo(w / 2, -h); ctx.lineTo(w / 2, 0); ctx.lineTo(-w / 2, 0);
    ctx.closePath();
    ctx.stroke();

    // —— 音符文字（白键上）——
    ctx.fillStyle = "rgba(60,85,120," + (0.55 + lit * 0.45).toFixed(3) + ")";
    ctx.font = "bold " + Math.round(h * 0.34) + "px 'Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(k.note, 0, -h * 0.45);

    ctx.restore();
  }

  /* ========== 渲染：彩虹泡泡 ========== */
  function drawBall(b, time, bass, mid) {
    var bounce = Math.max(0, bass);
    var puls = 1 + bounce * 0.6;
    var idle = isPlaying ? 0 : 0.02 * Math.sin(time * 0.0016 + b.seed * 6);
    var x = (b.x + b.vx * time * 0.05) * W;
    var y = (b.y + b.vy * time * 0.05 - bounce * 0.06 - idle) * H;
    var kk = 1.8 / b.z;
    var r = Math.max(4, b.baseR * kk * 340 * puls);
    var a = 0.5 + (2.0 - b.z) * 0.4;
    if (a > 0.95) a = 0.95;
    var bright = 58 + bounce * 35;

    var g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.35, r * 0.12, x, y, r);
    g.addColorStop(0, "hsla(" + b.hue + ",100%," + (bright + 22) + "%," + a.toFixed(3) + ")");
    g.addColorStop(0.6, "hsla(" + b.hue + ",92%," + bright + "%," + a.toFixed(3) + ")");
    g.addColorStop(1, "hsla(" + b.hue + ",85%," + Math.max(15, bright - 35) + "%," + a.toFixed(3) + ")");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, 6.2832);
    ctx.fill();

    ctx.fillStyle = "rgba(255,255,255," + (0.45 * a).toFixed(3) + ")";
    ctx.beginPath();
    ctx.arc(x - r * 0.3, y - r * 0.34, r * 0.16, 0, 6.2832);
    ctx.fill();
  }

  /* ========== 主循环 ========== */
  var lastT = 0;
  var bassSm = 0, midSm = 0, highSm = 0;

  function loop(t) {
    var dt = Math.min(50, t - lastT || 16);
    lastT = t;

    var bass = 0, mid = 0, high = 0;
    if (isPlaying && analyser && freq) {
      analyser.getByteFrequencyData(freq);
      for (var i = 0; i < 16; i++) bass += freq[i];
      for (var i = 16; i < 60; i++) mid += freq[i];
      for (var i = 60; i < 140; i++) high += freq[i];
      bass = bass / (16 * 255);
      mid = mid / (44 * 255);
      high = high / (80 * 255);
      bass = Math.pow(bass, 1.3);
      mid = Math.pow(mid, 1.15);
      high = Math.pow(high, 1.15);
    }
    bassSm += (bass - bassSm) * 0.22;
    midSm += (mid - midSm) * 0.28;
    highSm += (high - highSm) * 0.28;

    drawSky(t);
    // 泡泡画在琴键后面（先画球）
    for (var j = 0; j < balls.length; j++) drawBall(balls[j], t, bassSm, midSm);
    // 琴键（主体）
    for (var kk = 0; kk < keys.length; kk++) drawKey(keys[kk], t, bassSm, midSm, kk);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 返回游戏
  document.getElementById("back").addEventListener("click", function () {
    if (history.length > 1) history.back();
    else location.href = "index.html";
  });
})();
</script>
</body>
</html>
