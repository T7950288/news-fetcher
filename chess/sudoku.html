const TOTAL_LEVELS = 999;

// ================= 核心逻辑 =================
function parse(s){ const b=[]; for(let r=0;r<9;r++){const row=[];for(let c=0;c<9;c++)row.push(+s[r*9+c]);b.push(row);} return b; }
function toStr(b){ let s=''; for(const row of b) for(const v of row) s+=v; return s; }
function countCandidates(board,r,c){
  if(board[r][c]!==0) return new Set();
  const used=new Set();
  for(let i=0;i<9;i++){ used.add(board[r][i]); used.add(board[i][c]); }
  const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++) used.add(board[i][j]);
  const s=new Set();
  for(let n=1;n<=9;n++) if(!used.has(n)) s.add(n);
  return s;
}
function conflict(board,r,c,v){
  if(v!==solution[r][c]) return true;
  for(let i=0;i<9;i++){
    if(i!==c&&cellValue(board,r,i)===v) return true;
    if(i!==r&&cellValue(board,i,c)===v) return true;
  }
  const br=Math.floor(r/3)*3, bc=Math.floor(c/3)*3;
  for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++)
    if(!(i===r&&j===c)&&cellValue(board,i,j)===v) return true;
  return false;
}
function cellValue(board,r,c){ return user[r][c]||given[r][c]; }

// ================= 状态 =================
let given, solution, user, hinted, sel=null, showCands=false, mode='fill';
let excluded, highlight=null, undoStack=[], redoStack=[], level=1;
let board; // 当前显示盘面 = given+user

function playBoard(){
  const b=given.map(row=>row.slice());
  for(let r=0;r<9;r++)for(let c=0;c<9;c++) if(b[r][c]===0&&user[r][c]) b[r][c]=user[r][c];
  return b;
}
function visibleCands(r,c){
  if(!excluded) return new Set();
  const base=countCandidates(playBoard(),r,c);
  for(const n of excluded[r][c]) base.delete(n);
  return base;
}
function remaining(n){
  let k=0; for(let r=0;r<9;r++)for(let c=0;c<9;c++) if(cellValue(playBoard(),r,c)===n) k++;
  return 9-k;
}

// ================= 画布 =================
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const dpr=window.devicePixelRatio||1;
const C_BG='#eef1f5', C_CELL='#ffffff', C_REGION='#f0f4fa', C_SELECT='#c9dcff';
const C_HL_NUM='#ffe08a', C_HL_CAND='#fdf3d0';
const C_GIVEN='#1a1a1a', C_USER='#1e6fd9', C_HINT='#2e7d32', C_ERR='#e02020', C_CAND='#3f5a78';
const C_LINE='#8a8f98', C_BOLD='#1f2430';

function cellBg(r,c){
  if(sel&&sel[0]===r&&sel[1]===c) return C_SELECT;
  if(highlight){
    const v=cellValue(playBoard(),r,c);
    if(v===highlight) return C_HL_NUM;
    if(v===0&&visibleCands(r,c).has(highlight)) return C_HL_CAND;
  }
  if(sel&&(sel[0]===r||sel[1]===c||(Math.floor(r/3)===Math.floor(sel[0]/3)&&Math.floor(c/3)===Math.floor(sel[1]/3))))
    return C_REGION;
  return C_CELL;
}

function sizeCanvas(){
  const wrap=document.getElementById('boardWrap');
  // 棋盘同时受宽度和高度限制，保证不会侵入上下按钮区
  const availW=window.innerWidth-16;
  const availH=wrap.clientHeight || (window.innerHeight-200);
  const avail=Math.min(availW, availH, 560);
  const s=Math.floor(avail/9)*9;
  cv.style.width=s+'px'; cv.style.height=s+'px';
  cv.width=s*dpr; cv.height=s*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function draw(){
  const s=cv.width/dpr, cell=s/9;
  ctx.fillStyle=C_BG; ctx.fillRect(0,0,s,s);
  if(!given) return;
  const b=playBoard();
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const x0=c*cell, y0=r*cell;
    ctx.fillStyle=cellBg(r,c); ctx.fillRect(x0,y0,cell,cell);
    const u=user[r][c], g=given[r][c];
    if(u){
      ctx.fillStyle=conflict(b,r,c,u)?C_ERR:(hinted[r][c]?C_HINT:C_USER);
      ctx.font='bold '+(cell*0.5)+'px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(u),x0+cell/2,y0+cell/2+1);
    } else if(g){
      ctx.fillStyle=C_GIVEN;
      ctx.font='bold '+(cell*0.5)+'px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(g),x0+cell/2,y0+cell/2+1);
    } else if(showCands){
      const cands=visibleCands(r,c);
      const sub=cell/3;
      // 1-9 固定 3×3 位置，字号 cell*0.30（比最初大 58%，小格内居中不重叠）
      ctx.font='bold '+(cell*0.30)+'px Arial';
      ctx.fillStyle=C_CAND;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let n=1;n<=9;n++){
        if(!cands.has(n)) continue;
        const rr=Math.floor((n-1)/3), cc=(n-1)%3;
        ctx.fillText(String(n),x0+(cc+0.5)*sub,y0+(rr+0.5)*sub);
      }
    }
  }
  // 网格线
  for(let i=0;i<=9;i++){
    const bold=i%3===0;
    ctx.strokeStyle=bold?C_BOLD:C_LINE;
    ctx.lineWidth=bold?3:1;
    ctx.beginPath();
    ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,s); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0,i*cell); ctx.lineTo(s,i*cell); ctx.stroke();
  }
  updateStatus(); updateDigits();
}

function updateStatus(){
  document.getElementById('statusText').textContent=
    '第 '+level+' 关 · 已知数字 '+countClues(given)+' 个 · '+(mode==='cand'?'候选模式':'实填模式');
}
function countClues(b){ let k=0; for(const row of b) for(const v of row) if(v!==0) k++; return k; }

// ================= 数字面板 =================
const digitsEl=document.getElementById('digits');
const digitBtns=[];
function buildDigits(){
  digitsEl.innerHTML='';
  digitBtns.length=0;
  for(let n=1;n<=9;n++){
    const btn=document.createElement('button');
    btn.className='digit';
    btn.innerHTML='<span class="n">'+n+'</span><span class="rem"></span>';
    btn.addEventListener('click',()=>onDigit(n));
    digitsEl.appendChild(btn); digitBtns[n]=btn;
  }
}
function updateDigits(){
  for(let n=1;n<=9;n++){
    const rem=remaining(n);
    const btn=digitBtns[n];
    btn.querySelector('.rem').textContent='剩'+rem;
    btn.classList.toggle('gray',rem===0);
  }
}

// ================= 交互 =================
function onCanvasClick(ev){
  const rect=cv.getBoundingClientRect();
  const x=ev.clientX-rect.left, y=ev.clientY-rect.top;
  const s=rect.width, cell=s/9;
  const c=Math.floor(x/cell), r=Math.floor(y/cell);
  if(r>=0&&r<9&&c>=0&&c<9){
    const v=cellValue(playBoard(),r,c);
    if(v!==0){
      highlight=v; // 点已填数字的格子，只高亮该数字，不占用选中格
    } else {
      sel=[r,c]; // 点空格才切换选中格
    }
    draw();
  }
}
cv.addEventListener('click',onCanvasClick);
cv.addEventListener('touchstart',function(ev){
  const t=ev.touches[0];
  const rect=cv.getBoundingClientRect();
  const s=rect.width, cell=s/9;
  const c=Math.floor((t.clientX-rect.left)/cell), r=Math.floor((t.clientY-rect.top)/cell);
  if(r>=0&&r<9&&c>=0&&c<9){
    const v=cellValue(playBoard(),r,c);
    if(v!==0){
      highlight=v; // 点已填数字的格子，只高亮该数字，不占用选中格
    } else {
      sel=[r,c]; // 点空格才切换选中格
    }
    draw();
  }
},{passive:true});

function onDigit(n){
  if(!sel||!given) return;
  const r=sel[0], c=sel[1];
  if(given[r][c]!==0) return;
  if(mode==='cand'){
    if(user[r][c]!==0) return;
    if(!countCandidates(playBoard(),r,c).has(n)) { draw(); return; }
    if(excluded[r][c].has(n)) excluded[r][c].delete(n);
    else excluded[r][c].add(n);
    highlight=n; draw();
    return;
  }
  // 实填
  input(r,c,n);
  highlight=n;
  draw();
}
function input(r,c,n){
  const old=user[r][c];
  if(old===n) return;
  user[r][c]=n; hinted[r][c]=false;
  undoStack.push([r,c,old,n]); redoStack.length=0;
  draw(); checkWin();
}
function onErase(){
  if(!given) return;
  if(mode==='cand'&&sel){
    const r=sel[0], c=sel[1];
    if(given[r][c]===0&&user[r][c]===0) excluded[r][c].clear();
    highlight=null; draw(); return;
  }
  if(sel) input(sel[0],sel[1],0);
  highlight=null; draw();
}
function onUndo(){
  if(!undoStack.length) return;
  const [r,c,old,newv]=undoStack.pop();
  user[r][c]=old; hinted[r][c]=false;
  redoStack.push([r,c,old,newv]); draw();
}
function onRedo(){
  if(!redoStack.length) return;
  const [r,c,old,newv]=redoStack.pop();
  user[r][c]=newv; hinted[r][c]=false;
  undoStack.push([r,c,old,newv]); draw();
}
function onHint(){
  if(!sel||!given) { showToast('请先点选一个空格',1500); return; }
  const r=sel[0], c=sel[1];
  if(given[r][c]!==0) return;
  const old=user[r][c];
  user[r][c]=solution[r][c]; hinted[r][c]=true;
  undoStack.push([r,c,old,solution[r][c]]); redoStack.length=0;
  draw(); checkWin();
}
function onCheck(){
  if(!given) return;
  let errs=0, filled=0;
  const total=81-countClues(given);
  const b=playBoard();
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    if(user[r][c]){ filled++; if(conflict(b,r,c,user[r][c])) errs++; }
  }
  if(errs===0&&filled===total){
    if(level>=TOTAL_LEVELS){ showToast('恭喜！全部 '+TOTAL_LEVELS+' 关已完成！',3000); }
    else { showToast('恭喜！第 '+level+' 关已全部填对！\n1.5秒后自动进入下一关',1600); setTimeout(function(){ goto(level+1); },1500); }
  }
  else if(errs===0) showToast('已填的数字都正确，继续完成剩余空格即可！',2000);
  else showToast('有 '+errs+' 个格子填错（红色标出），请修改。',2000);
}
function checkWin(){
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const g=given[r][c], u=user[r][c];
    if(g===0&&u===0) return;
    if(u&&u!==solution[r][c]) return;
  }
  if(level>=TOTAL_LEVELS){ showToast('恭喜！全部 '+TOTAL_LEVELS+' 关已完成！',3000); return; }
  showToast('恭喜！第 '+level+' 关完成\n1.5秒后自动进入下一关',1600);
  setTimeout(function(){ goto(level+1); },1500);
}
let toastTimer=null;
function showToast(msg,duration){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.classList.remove('show'); },duration||2000);
}

// ================= 关卡 =================
function loadLevel(lv){
  lv=Math.max(1,Math.min(TOTAL_LEVELS,lv));
  level=lv;
  try{ localStorage.setItem('sudoku999_level',lv); }catch(e){}
  given=parse(LEVEL_PUZZLES[lv-1]);
  solution=parse(LEVEL_SOLUTIONS[lv-1]);
  user=[];
  for(let r=0;r<9;r++){ user.push([]); for(let c=0;c<9;c++) user[r].push(0); }
  hinted=user.map(row=>row.slice());
  excluded=[];
  for(let r=0;r<9;r++){ excluded.push([]); for(let c=0;c<9;c++) excluded[r].push(new Set()); }
  sel=null; showCands=false; highlight=null; undoStack=[]; redoStack=[];
  mode='fill'; setModeBtn();
  document.getElementById('levelInput').value=lv;
  draw();
}
function goto(lv){ loadLevel(lv); }
function setModeBtn(){
  const b=document.getElementById('modeBtn');
  if(mode==='cand'){ b.textContent='模式：候选'; b.classList.add('cand'); showCands=true; }
  else { b.textContent='模式：实填'; b.classList.remove('cand'); }
}
function toggleMode(){
  mode=(mode==='fill')?'cand':'fill';
  setModeBtn(); draw();
}

// ================= 按钮绑定 =================
document.getElementById('startBtn').addEventListener('click',()=>{
  let v=parseInt(document.getElementById('levelInput').value,10);
  if(isNaN(v)) v=1;
  loadLevel(v);
});
document.getElementById('modeBtn').addEventListener('click',toggleMode);
document.getElementById('candsBtn').addEventListener('click',()=>{ showCands=!showCands; draw(); });
document.getElementById('eraseBtn').addEventListener('click',onErase);
document.getElementById('undoBtn').addEventListener('click',onUndo);
document.getElementById('redoBtn').addEventListener('click',onRedo);
document.getElementById('hintBtn').addEventListener('click',onHint);
document.getElementById('checkBtn').addEventListener('click',onCheck);
document.getElementById('prevBtn').addEventListener('click',()=>goto(level-1));
document.getElementById('nextBtn').addEventListener('click',()=>goto(level+1));
document.getElementById('restartBtn').addEventListener('click',()=>{
  user=[];
  for(let r=0;r<9;r++){ user.push([]); for(let c=0;c<9;c++) user[r].push(0); }
  hinted=user.map(row=>row.slice());
  excluded=[];
  for(let r=0;r<9;r++){ excluded.push([]); for(let c=0;c<9;c++) excluded[r].push(new Set()); }
  undoStack=[]; redoStack=[]; sel=null; highlight=null; draw();
});

// 键盘支持（桌面调试用）
document.addEventListener('keydown',function(ev){
  const ctrl=ev.ctrlKey||ev.metaKey;
  if(ctrl&&(ev.key==='z'||ev.key==='Z')){ onUndo(); return; }
  if(ctrl&&(ev.key==='y'||ev.key==='Y')){ onRedo(); return; }
  if(/^[1-9]$/.test(ev.key)){
    const n=+ev.key;
    if(!sel||!given){ return; }
    const r=sel[0],c=sel[1];
    if(given[r][c]!==0) return;
    if(mode==='cand'){ if(user[r][c]===0&&countCandidates(playBoard(),r,c).has(n)){
      if(excluded[r][c].has(n)) excluded[r][c].delete(n); else excluded[r][c].add(n); draw(); } return; }
    input(r,c,n); highlight=n; draw();
  } else if(ev.key==='Backspace'||ev.key==='Delete'||ev.key==='0'){
    onErase();
  } else if(ev.key===' '){
    showCands=!showCands; draw();
  }
});

buildDigits();
// 读取保存的关卡，没有则从第1关开始
let initLv=1;
try{
  const saved=parseInt(localStorage.getItem('sudoku999_level'),10);
  if(saved&&saved>=1&&saved<=TOTAL_LEVELS) initLv=saved;
}catch(e){}
loadLevel(initLv);
sizeCanvas();                    // 首次进入就设置棋盘尺寸，保证格子方正
window.addEventListener('resize',sizeCanvas);
</script>
</body>
