<!-- 临时诊断页：验证云端 Worker 能否加载引擎并响应（测完即删） -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>wt</title>
</head>
<body>
<script>
var w;
try {
  w = new Worker("xiangqi_engine.js?v=9");
} catch (e) {
  document.title = "WT_CREATE_ERR:" + e.message;
}
if (w) {
  w.onmessage = function (e) {
    document.title = "WT:" + JSON.stringify(e.data);
  };
  w.onerror = function (e) {
    document.title = "WT_LOAD_ERR:" + (e.message || "未知");
  };
  setTimeout(function () {
    w.postMessage({ type: "ping" });
  }, 300);
}
</script>
</body>
</html>
