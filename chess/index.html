<!DOCTYPE html>

<head>

<title>棋类</title>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
         background:#f5f6f8; color:#1a1a1a; line-height:1.6; }
  header { background:#1a3a6c; color:#fff; padding:12px 20px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  .header-inner { max-width:960px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-size:20px; font-weight:700; letter-spacing:1px; }
  .container { max-width:960px; margin:24px auto 40px; padding:0 20px; }
  .section-title { font-size:15px; font-weight:700; color:#1a3a6c; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .card { background:#fff; border-radius:12px; padding:22px 20px; cursor:pointer;
          box-shadow:0 1px 4px rgba(0,0,0,.08); transition:box-shadow .15s, transform .15s;
          text-decoration:none; color:inherit; display:block; border:1px solid #eef0f4; }
  .card:hover { box-shadow:0 4px 14px rgba(0,0,0,.12); transform:translateY(-2px); }
  .card.disabled { cursor:default; opacity:.55; }
  .card.disabled:hover { transform:none; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .card-icon { font-size:34px; margin-bottom:10px; }
  .card-name { font-size:19px; font-weight:700; margin-bottom:6px; color:#1a3a6c; }
  .card-desc { font-size:13px; color:#777; }
  .card-tag { display:inline-block; margin-top:12px; padding:3px 10px; border-radius:12px;
              font-size:12px; background:#e8f0fe; color:#1a3a6c; }
  .card-tag.soon { background:#f1f3f4; color:#5f6368; }
  .back { display:inline-block; margin-top:18px; font-size:13px; color:#1a3a6c; text-decoration:none; }
  @media (max-width:768px){
    .container { padding:0 14px; margin-top:16px; }
    .card { padding:18px 16px; }
  }
  @media (max-width:520px){
    header { padding:10px 14px; }
    .logo { font-size:17px; }
    .header-inner a { font-size:12px; }
    .container { padding:0 10px; margin-top:12px; margin-bottom:16px; }
    .section-title { font-size:13px; margin-bottom:8px; }
    .grid { grid-template-columns:repeat(3,1fr); gap:8px; }
    .card { padding:12px 4px; border-radius:10px; text-align:center; }
    .card-icon { font-size:22px; margin-bottom:6px; }
    .card-name { font-size:13px; margin-bottom:0; }
    .card-desc, .card-tag { display:none; }
    .back { margin-top:12px; font-size:12px; }
  }
</style>
</head>
