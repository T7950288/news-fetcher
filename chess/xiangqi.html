<!-- v3-pikafish -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>象棋 · 皮卡鱼引擎</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a3a6c'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white'%3E棋%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#d9b078; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; color:#1a1a1a; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; touch-action:manipulation; }
  .topbar { position:fixed; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; gap:5px; padding:7px 10px;
    background:rgba(20,32,52,.82); color:#fff; font-size:13px;
    padding-top:calc(7px + env(safe-area-inset-top)); }
  .topbar a { color:#fff; text-decoration:none; font-size:14px; padding:4px 6px; }
  .topbar .t { font-weight:700; white-space:nowrap; }
  .topbar .sp { flex:1; }
  .topbar select { font-size:12px; padding:3px 2px; border:none; border-radius:5px; background:#fff; color:#1a1a1a; max-width:74px; }
  .topbar button { font-size:12px; padding:5px 8px; border:none; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .topbar .bNew { background:#4CAF50; color:#fff; font-weight:700; }
  .topbar .bUndo { background:#e0e0e0; color:#333; }
  .topbar .bRes { background:#e53935; color:#fff; }
  .topbar button:disabled { opacity:.45; cursor:wait; }
  .statusbar { position:fixed; left:0; right:0; top:calc(40px + env(safe-area-inset-top)); z-index:20;
    display:flex; justify-content:center; align-items:center; gap:10px;
    background:rgba(20,32,52,.55); color:#fff; font-size:12px; padding:3px 8px;
    pointer-events:none; flex-wrap:wrap; }
  .statusbar .badge { font-weight:700; padding:1px 10px; border-radius:10px; background:#e8f0fe; color:#1a3a6c; }
  .statusbar .badge.ai { background:#fce8e6; color:#a50e0e; }
  .statusbar .badge.load { background:#fdf3d7; color:#8a6d3b; }
  .overlay { position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.45); }
  .overlay .box { background:#fff; border-radius:14px; padding:26px 30px; text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.3); max-width:82%; }
  .overlay .big { font-size:24px; font-weight:800; color:#1a3a6c; margin-bottom:6px; }
  .overlay .sub { font-size:13px; color:#555; margin-bottom:16px; }
  .overlay button { font-size:15px; font-weight:700; padding:10px 30px; border:none; border-radius:10px;
    background:#1a3a6c; color:#fff; cursor:pointer; }
  .toast { position:fixed; top:55%; left:50%; transform:translate(-50%,-50%); z-index:60;
    background:rgba(20,32,52,.92); color:#fff; padding:12px 22px; border-radius:10px;
    font-size:15px; font-weight:700; display:none; max-width:86%; text-align:center; }
  @media (max-width:520px){
    .topbar { font-size:12px; gap:4px; padding:6px 6px; padding-top:calc(6px + env(safe-area-inset-top)); }
    .topbar a { font-size:13px; padding:3px 4px; }
    .topbar select { font-size:11px; max-width:62px; }
    .topbar button { font-size:11px; padding:4px 6px; }
    .statusbar { top:calc(36px + env(safe-area-inset-top)); font-size:11px; gap:6px; }
  }
</style>
</head>
<body>
<canvas id="board"></canvas>
<div class="topbar">
  <a href="index.html">←</a>
  <span class="t">象棋</span>
  <span class="sp"></span>
  <select id="selDiff">
    <option value="300">难度·快</option>
    <option value="1200" selected>难度·中</option>
    <option value="3000">难度·强</option>
    <option value="8000">难度·最强</option>
  </select>
  <select id="selColor">
    <option value="1" selected>执红</option>
    <option value="-1">执黑</option>
  </select>
  <button class="bNew" id="btnNew">新局</button>
  <button class="bUndo" id="btnUndo">悔棋</button>
  <button class="bRes" id="btnRes">认输</button>
</div>
<div class="statusbar">
  <span class="badge" id="turnBadge">准备开始</span>
  <span id="moveInfo">步数 0</span>
  <span id="engInfo">引擎加载中…</span>
</div>
<div class="overlay" id="overlay">
  <div class="box">
    <div class="big" id="ovTitle"></div>
    <div class="sub" id="ovSub"></div>
    <button id="btnAgain">再来一局</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="xiangqi_engine.js"></script>
<script>
(function () {
  "use strict";
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  /* ---------- 状态 ---------- */
  let board = null;
  let playerSide = 1;          // 1红 -1黑
  let aiSide = -1;
  let playing = false;
  let aiThinking = false;
  let selected = null;
  let moveCount = 0;
  const moveHistory = [];      // [{mv, side, uci}]
  const PIECE_NAME = { 1:"帅",2:"仕",3:"相",4:"马",5:"车",6:"炮",7:"兵",
                      "-1":"将","-2":"士","-3":"象","-4":"马","-5":"车","-6":"炮","-7":"卒" };
  const START_FEN = "rnbakabnr/9/1c5c1/p1p1p1p1p/9/9/P1P1P1P1P/1C5C1/9/RNBAKABNR w - - 0 1";

  /* ---------- 皮卡鱼 WASM 引擎（Web Worker） ---------- */
  let worker = null, engineReady = false, moveId = 0;
  function ensureWorker() {
    if (worker) return;
    try {
      worker = new Worker("pikafish/pikafish_worker.js");
      worker.onmessage = onWorkerMsg;
      worker.onerror = function (e) {
        document.title = "WORKER_ERR:" + (e.message || "unknown");
        setEng("引擎出错");
        worker = null;
      };
      worker.postMessage({ type: "init" });
    } catch (e) {
      document.title = "WORKER_ERR:" + e.message;
      worker = null;
      setEng("引擎不可用");
    }
  }
  function onWorkerMsg(e) {
    const msg = e.data;
    if (!msg) return;
    if (msg.type === "ready") { engineReady = true; setEng("引擎就绪"); }
    else if (msg.type === "status") {
      if (msg.status) setEng(msg.status);
    }
    else if (msg.type === "error") {
      setEng("引擎异常");
      console.error("引擎错误:", msg.error);
    }
    else if (msg.type === "stdout") {
      window._xqLines = window._xqLines || [];
      window._xqLines.push(msg.line);
      if (window._xqLines.length > 200) window._xqLines.shift();
    }
    else if (msg.type === "dbg") {
      window._xqDbg = window._xqDbg || [];
      window._xqDbg.push(msg.line);
      if (window._xqDbg.length > 200) window._xqDbg.shift();
    }
    else if (msg.type === "move" && msg.id === moveId) {
      if (msg.uci) onAIMove(msg.uci);
    }
  }
  function setEng(t) { document.getElementById("engInfo").textContent = t; }

  function boardToUci(r, c) {
    /* 统一红方视角（Pikafish UCI：row0=红底线、列 a=红方左侧，黑白双方均如此） */
    return String.fromCharCode(97 + c) + (9 - r);
  }
  function uciToBoard(u) {
    return { r: 9 - parseInt(u.charAt(1), 10), c: u.charCodeAt(0) - 97 };
  }
  function requestAIMove() {
    if (!playing) return;
    aiThinking = true;
    updateUI(); render();
    const moves = [];
    for (let i = 0; i < moveHistory.length; i++) moves.push(moveHistory[i].uci);
    const ms = parseInt(document.getElementById("selDiff").value, 10) || 1200;
    const msg = { type: "go", id: ++moveId, moves: moves, movetime: ms };
    if (worker && engineReady) {
      worker.postMessage(msg);
    } else {
      setTimeout(function () { if (playing) requestAIMove(); }, 400); // 引擎未就绪，稍候重试
    }
  }
  function onAIMove(uci) {
    aiThinking = false;
    if (!playing) { updateUI(); render(); return; }
    const p = uciToBoard(uci);
    const t = uciToBoard(uci.slice(2));
    if (p.r < 0 || p.r > 9 || p.c < 0 || p.c > 8 || t.r < 0 || t.r > 9 || t.c < 0 || t.c > 8) { flashMsg("引擎返回异常走法"); return; }
    const legal = XQ.genLegalMoves(board, aiSide).filter(function (m) {
      return m.fr === p.r && m.fc === p.c && m.tr === t.r && m.tc === t.c;
    });
    const mv = legal[0];
    if (!mv) {
      const legalAll = XQ.genLegalMoves(board, aiSide);
      if (legalAll.length === 0) { finishByNoMove(aiSide); return; }
      flashMsg("引擎走法不合法（" + uci + "），重试");
      selected = null;
      render();
      setTimeout(function () { if (playing) requestAIMove(); }, 300);
      return;
    }
    applyMove(mv, aiSide);
  }

  /* ---------- 对局流程 ---------- */
  function newGame() {
    playerSide = parseInt(document.getElementById("selColor").value, 10) || 1;
    aiSide = -playerSide;
    board = XQ.initialBoard();
    playing = true;
    selected = null;
    moveCount = 0;
    moveHistory.length = 0;
    aiThinking = false;
    moveId++;
    document.getElementById("overlay").style.display = "none";
    document.getElementById("toast").style.display = "none";
    ensureWorker();
    resizeCanvas();
    updateUI();
    if (playerSide === -1) requestAIMove();   // 执黑：AI 执红先行
  }

  function applyMove(mv, side) {
    if (!board || !playing) return;
    const eaten = board[mv.tr][mv.tc];
    board = XQ.apply(board, mv);
    const uciFrom = boardToUci(mv.fr, mv.fc);
    const uciTo = boardToUci(mv.tr, mv.tc);
    moveHistory.push({ mv: mv, side: side, eaten: eaten, uci: uciFrom + uciTo });
    moveCount++;
    selected = null;
    render();
    /* 将军提示 */
    if (XQ.inCheck(board, -side)) {
      flashMsg("将军！");
    }
    /* 检查对局是否结束（无棋可走即负） */
    if (!XQ.genLegalMoves(board, -side).length) {
      finishByNoMove(-side);
      return;
    }
    updateUI();
    if (side === playerSide && playing) requestAIMove();
  }

  function finishByNoMove(loserSide) {
    playing = false;
    const loserName = loserSide === 1 ? "红方" : "黑方";
    const winnerName = loserSide === 1 ? "黑方" : "红方";
    showOverlay(loserSide === aiSide ? "你赢了！" : "你输了", loserName + "无棋可走，" + winnerName + "胜");
    updateUI();
  }

  function undoMove() {
    if (!playing && !moveHistory.length) return;
    if (aiThinking) return;
    moveId++;
    let removed = 0;
    while (moveHistory.length && removed < 2) {
      const last = moveHistory.pop();
      board = XQ.apply(board, { fr: last.mv.tr, fc: last.mv.tc, tr: last.mv.fr, tc: last.mv.fc });
      if (last.eaten) board[last.mv.tr][last.mv.tc] = last.eaten;
      moveCount--;
      removed++;
      if (last.side === playerSide) break;
    }
    if (removed) {
      selected = null;
      document.getElementById("toast").style.display = "none";
      render(); updateUI();
    }
  }

  function resign() {
    if (!playing) return;
    if (!confirm("确定要认输吗？")) return;
    playing = false;
    moveId++;
    const who = playerSide === 1 ? "黑方" : "红方";
    showOverlay("你认输了", who + "胜");
    updateUI();
  }

  function showOverlay(title, sub) {
    document.getElementById("ovTitle").textContent = title;
    document.getElementById("ovSub").textContent = sub;
    document.getElementById("overlay").style.display = "flex";
  }

  /* ---------- 绘制（满屏棋盘） ---------- */
  let cell = 0, cellW = 0, cellH = 0, ox = 0, oy = 0;
  function barBottom() {
    const sb = document.querySelector(".statusbar");
    return sb ? sb.getBoundingClientRect().bottom + 2 : (canvas.width < 520 ? 58 : 62);
  }
  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const availH = Math.max(140, canvas.height - barBottom());
    cellW = canvas.width / 9;
    cellH = availH / 10;
    cell = Math.min(cellW, cellH);
    ox = 0;
    oy = barBottom();
    render();
  }
  function X(c) { return ox + cellW * (c + 0.5); }
  function Y(r) { return oy + cellH * (r + 0.5); }

  function render() {
    if (!board) return;
    const W = canvas.width, H = canvas.height, S = cell;
    ctx.clearRect(0, 0, W, H);
    /* 木色满屏底 */
    ctx.fillStyle = "#d9b078";
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#5a4632";
    ctx.lineWidth = 1;
    /* 横线 */
    ctx.beginPath();
    for (let r = 0; r < 10; r++) { ctx.moveTo(X(0), Y(r)); ctx.lineTo(X(8), Y(r)); }
    /* 竖线（河界断开） */
    for (let c = 0; c < 9; c++) {
      ctx.moveTo(X(c), Y(0)); ctx.lineTo(X(c), Y(4));
      ctx.moveTo(X(c), Y(5)); ctx.lineTo(X(c), Y(9));
    }
    ctx.stroke();
    /* 外边框 */
    ctx.strokeStyle = "#5a4632";
    ctx.lineWidth = 2;
    ctx.strokeRect(X(0) - cellW * 0.5, Y(0) - cellH * 0.5, cellW * 9, cellH * 10);
    ctx.lineWidth = 1;
    /* 九宫斜线 */
    ctx.beginPath();
    ctx.moveTo(X(3), Y(7)); ctx.lineTo(X(5), Y(9));
    ctx.moveTo(X(5), Y(7)); ctx.lineTo(X(3), Y(9));
    ctx.moveTo(X(3), Y(0)); ctx.lineTo(X(5), Y(2));
    ctx.moveTo(X(5), Y(0)); ctx.lineTo(X(3), Y(2));
    ctx.stroke();
    /* 兵/炮位标记 */
    ctx.lineWidth = 1.4;
    const marks = [[6,0],[6,2],[6,4],[6,6],[6,8],[7,1],[7,7],[3,0],[3,2],[3,4],[3,6],[3,8],[2,1],[2,7]];
    for (let i = 0; i < marks.length; i++) {
      const m = marks[i], x = X(m[1]), y = Y(m[0]), d = S * 0.14;
      ctx.beginPath();
      ctx.moveTo(x - d, y); ctx.lineTo(x + d, y);
      ctx.moveTo(x, y - d); ctx.lineTo(x, y + d);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    /* 楚河 汉界 */
    ctx.fillStyle = "#5a4632";
    ctx.font = "bold " + Math.round(S * 0.42) + "px \"KaiTi\",\"STKaiti\",\"Microsoft YaHei\",serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("楚  河", X(1.7), Y(4.5));
    ctx.fillText("汉  界", X(7.3), Y(4.5));
    /* 棋子 */
    for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
      const p = board[r][c];
      if (p === 0) continue;
      const x = X(c), y = Y(r), Rx = cellW * 0.42, Ry = cellH * 0.42;
      const grad = ctx.createRadialGradient(x - Rx * 0.25, y - Ry * 0.25, Math.min(Rx, Ry) * 0.15, x, y, Math.max(Rx, Ry));
      grad.addColorStop(0, "#fff8e1"); grad.addColorStop(1, "#e2c98f");
      ctx.beginPath(); ctx.ellipse(x, y, Rx, Ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = grad; ctx.fill();
      ctx.strokeStyle = "#8a6d3b"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = p > 0 ? "#c62828" : "#212121";
      ctx.font = "bold " + Math.round(S * 0.52) + "px \"KaiTi\",\"STKaiti\",\"Microsoft YaHei\",serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(PIECE_NAME[p], x, y + 1);
    }
    /* 选中 + 可走点 */
    if (selected && playing && !aiThinking) {
      const x = X(selected.c), y = Y(selected.r);
      ctx.strokeStyle = "#1565C0"; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(x, y, cellW * 0.46, cellH * 0.46, 0, 0, Math.PI * 2); ctx.stroke();
      const moves = XQ.genLegalMoves(board, playerSide).filter(function (m) {
        return m.fr === selected.r && m.fc === selected.c;
      });
      for (let i = 0; i < moves.length; i++) {
        const m = moves[i];
        ctx.fillStyle = board[m.tr][m.tc] !== 0 ? "#e53935" : "#1565C0";
        ctx.beginPath(); ctx.ellipse(X(m.tc), Y(m.tr), m.cap ? cellW * 0.2 : cellW * 0.1, m.cap ? cellH * 0.2 : cellH * 0.1, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.lineWidth = 1;
    }
    /* 最后一手标记 */
    if (moveHistory.length) {
      const last = moveHistory[moveHistory.length - 1].mv;
      ctx.fillStyle = "rgba(21,101,192,.55)";
      ctx.beginPath(); ctx.ellipse(X(last.tc), Y(last.tr), Math.max(3, cellW * 0.08), Math.max(3, cellH * 0.08), 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  /* ---------- 交互 ---------- */
  canvas.addEventListener("click", function (e) {
    if (!playing) return;
    if (aiThinking) { flashMsg("AI 思考中…请稍候"); return; }
    const c = Math.round((e.clientX - ox) / cellW - 0.5);
    const r = Math.round((e.clientY - oy) / cellH - 0.5);
    if (r < 0 || r >= 10 || c < 0 || c >= 9) return;
    const p = board[r][c];
    if (p !== 0 && Math.sign(p) === playerSide) { selected = { r: r, c: c }; render(); return; }
    if (selected) {
      const legal = XQ.genLegalMoves(board, playerSide).filter(function (m) {
        return m.fr === selected.r && m.fc === selected.c && m.tr === r && m.tc === c;
      });
      if (legal.length) { applyMove(legal[0], playerSide); return; }
      if (p !== 0 && Math.sign(p) === aiSide) {
        const sp = Math.abs(board[selected.r][selected.c]);
        if (sp === 6) flashMsg("炮吃子必须隔一个子当炮架，且目标在直线方向");
        else flashMsg("该目标不在你选中棋子的走法内，吃不了");
      } else {
        flashMsg("该位置不可走（先点选己方棋子，再点蓝色/红色圆点）");
      }
      selected = null; render(); return;
    }
    if (p !== 0 && Math.sign(p) === aiSide) { flashMsg("这是对方的棋子，你执" + (playerSide === 1 ? "红" : "黑")); return; }
  });

  function flashMsg(text) {
    const t = document.getElementById("toast");
    t.textContent = text;
    t.style.display = "block";
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.style.display = "none"; }, 1600);
  }

  /* ---------- UI ---------- */
  function captureCount(side) {
    let cnt = 0;
    const init = { 1: 1, 2: 2, 3: 2, 4: 2, 5: 2, 6: 2, 7: 5 };
    const now = {};
    for (let r = 0; r < 10; r++) for (let c = 0; c < 9; c++) {
      const p = board[r][c];
      if (p !== 0) now[Math.abs(p)] = (now[Math.abs(p)] || 0) + 1;
    }
    if (side === 1) for (const k in init) cnt += init[k] - (now[k] || 0);
    return Math.max(0, cnt);
  }
  function updateUI() {
    const badge = document.getElementById("turnBadge");
    const redEaten = captureCount(1), blackEaten = captureCount(-1);
    if (!playing) { badge.textContent = "已结束"; badge.className = "badge"; }
    else if (aiThinking) {
      badge.textContent = "AI 思考中…";
      badge.className = "badge ai";
    } else {
      const turn = moveHistory.length ? -moveHistory[moveHistory.length - 1].side : 1;
      const isPlayer = turn === playerSide;
      badge.textContent = (turn === 1 ? "红方" : "黑方") + "行棋" + (isPlayer ? "（你）" : "（AI）");
      badge.className = isPlayer ? "badge" : "badge ai";
    }
    document.getElementById("moveInfo").textContent =
      "步数 " + moveCount + " · 吃子 红" + blackEaten + "/黑" + redEaten;
  }

  /* ---------- 绑定 ---------- */
  document.getElementById("btnNew").addEventListener("click", newGame);
  document.getElementById("btnUndo").addEventListener("click", undoMove);
  document.getElementById("btnRes").addEventListener("click", resign);
  document.getElementById("btnAgain").addEventListener("click", newGame);
  window.addEventListener("resize", resizeCanvas);

  resizeCanvas();
  newGame();

  /* 自动走子自测（仅 ?autotest=1） */
  if (/(\?|&)autotest(=|&|$)/.test(location.search)) {
    setTimeout(function () {
      try {
        const rect = canvas.getBoundingClientRect();
        function clickAt(r, c) {
          const x = ox + (c + 0.5) * cellW, y = oy + (r + 0.5) * cellH;
          canvas.dispatchEvent(new MouseEvent("click", { clientX: x, clientY: y, bubbles: true }));
        }
        clickAt(9, 1);
        const sel = selected ? selected.r + "," + selected.c : "空";
        clickAt(7, 2);
        const afterPlayer = moveCount;
        document.title = "AUTOTEST:选马=" + sel + "|玩家走后步数=" + afterPlayer;
        setTimeout(function () {
          document.title = "AUTOTEST:AI步数=" + moveCount + "|引擎=" +
            (engineReady ? "就绪" : "未就绪") + "|标题=" + document.title;
        }, 12000);
      } catch (e) {
        document.title = "AUTOTEST_ERR:" + e.message;
      }
    }, 900);
  }
})();
</script>
</body>
</html>
