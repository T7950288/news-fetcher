<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>扫雷 · 经典版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif;
    background: #e9edf1; color: #1f2328;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 8px 20px;
  }
  /* 顶部工具栏：返回键放在上方中间 */
  .toolbar {
    width: 100%; max-width: 700px; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px 10px;
  }
  .toolbar .side { width: 110px; font-size: 13px; color: #57606a; }
  .toolbar .side.right { text-align: right; }
  .toolbar .side.right.new { color: #c1121f; font-weight: 700; }
  .back-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 14px; color: #1f2328; text-decoration: none;
    background: #fff; border: 1px solid #d0d7de; border-radius: 999px;
    padding: 6px 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    user-select: none; -webkit-user-select: none;
  }
  .back-btn:hover { background: #f6f8fa; }
  /* 经典面板 */
  .frame {
    background: #c0c0c0; padding: 8px;
    border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff;
    border-radius: 2px;
  }
  .panel {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px; margin-bottom: 8px;
    border: 2px solid; border-color: #808080 #ffffff #ffffff #808080;
  }
  .lcd {
    background: #000; padding: 3px 4px;
    display: flex; gap: 2px;
    border: 2px solid; border-color: #808080 #ffffff #ffffff #808080;
  }
  .lcd svg { display: block; }
  .face {
    width: 36px; height: 36px; background: #c0c0c0; border: none; cursor: pointer;
    padding: 2px;
    border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff;
  }
  .face:active { border-color: #808080 #ffffff #ffffff #808080; }
  .face svg { width: 100%; height: 100%; display: block; }
  /* 棋盘容器（浮雕边框），内部用 Canvas 绘制 */
  .grid {
    display: block;
    border: 2px solid; border-color: #808080 #ffffff #ffffff #808080;
    line-height: 0;
  }
  .grid canvas { display: block; }
  .hint { margin-top: 14px; font-size: 13px; color: #57606a; text-align: center; max-width: 640px; }
  .foot { margin-top: 6px; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
  <div class="toolbar">
    <div class="side">扫雷 · 经典版</div>
    <a class="back-btn" href="index.html">← 棋类</a>
    <div class="side right" id="bestBox">最快 --</div>
  </div>

  <div class="frame">
    <div class="panel">
      <div class="lcd" id="lcdMines"></div>
      <button class="face" id="faceBtn" title="重新开始"></button>
      <div class="lcd" id="lcdTimer"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="hint">左键翻开 · 右键/长按插旗（再按一次变问号） · 点击已翻开的数字格可自动翻开周围</div>
  <div class="foot">经典高级难度：30 × 16 · 99 雷 · v2.2</div>

<script>
(function(){
  'use strict';
  var ROWS = 16, COLS = 30, MINES = 99;
  var board = [];
  var state = 'ready'; // ready | playing | won | lost
  var started = false;
  var seconds = 0, minesLeft = MINES, timerId = null;
  var suppressClick = false, suppressContext = false;
  var pressed = null; // 当前按下的格子（WIN 按压凹陷反馈）
  var gridEl = document.getElementById('grid');
  var faceBtn = document.getElementById('faceBtn');
  var lcdMines = document.getElementById('lcdMines');
  var lcdTimer = document.getElementById('lcdTimer');
  var bestEl = document.getElementById('bestBox');
  var BEST_KEY = 'ms_best_time', best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}
  function renderBest(newRecord){
    if (!bestEl) return;
    bestEl.textContent = '最快 ' + (best > 0 ? best + ' 秒' : '--');
    if (newRecord) {
      bestEl.classList.add('new');
      setTimeout(function(){ bestEl.classList.remove('new'); }, 3000);
    }
  }
  renderBest(false);

  /* ---------- Canvas 渲染层（替代 480 个 DOM 格子，彻底解决卡顿） ---------- */
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  gridEl.appendChild(canvas);
  var cellPx = 21, dpr = 1;
  var NUM_COLORS = ['', '#0000ff', '#008000', '#ff0000', '#000080', '#800000', '#008080', '#000000', '#808080'];

  function drawMine(x, y, s){
    var cx = x + s / 2, cy = y + s / 2;
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1, s * 0.07); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx, y + s * 0.28); ctx.lineTo(cx, y + s * 0.72);
    ctx.moveTo(x + s * 0.28, cy); ctx.lineTo(x + s * 0.72, cy);
    ctx.moveTo(x + s * 0.33, y + s * 0.33); ctx.lineTo(x + s * 0.67, y + s * 0.67);
    ctx.moveTo(x + s * 0.67, y + s * 0.33); ctx.lineTo(x + s * 0.33, y + s * 0.67);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, s * 0.22, 0, 7); ctx.fillStyle = '#000'; ctx.fill();
    ctx.beginPath(); ctx.arc(cx - s * 0.07, cy - s * 0.09, s * 0.045, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
  }
  function drawFlag(x, y, s){
    var px = x + s * 0.3, py = y + s * 0.08;
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(1, s * 0.08); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, y + s * 0.92); ctx.stroke();
    ctx.fillStyle = '#e11';
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(x + s * 0.72, y + s * 0.3); ctx.lineTo(px, y + s * 0.5); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(px, y + s * 0.92, s * 0.07, 0, 7); ctx.fillStyle = '#000'; ctx.fill();
  }
  function drawX(x, y, s){
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, s * 0.13); ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + s * 0.25, y + s * 0.25); ctx.lineTo(x + s * 0.75, y + s * 0.75);
    ctx.moveTo(x + s * 0.75, y + s * 0.25); ctx.lineTo(x + s * 0.25, y + s * 0.75);
    ctx.stroke();
  }
  function drawCell(r, c){
    var cell = board[r][c];
    var x = c * cellPx, y = r * cellPx;
    if (cell.open) {
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(x, y, cellPx, cellPx);
      ctx.strokeStyle = '#9aa0a6'; ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, cellPx - 1, cellPx - 1);
      if (cell.mine) {
        if (cell.boom) { ctx.fillStyle = '#ff0000'; ctx.fillRect(x + 1, y + 1, cellPx - 2, cellPx - 2); }
        drawMine(x, y, cellPx);
      } else if (cell.near > 0) {
        ctx.fillStyle = NUM_COLORS[cell.near];
        ctx.font = '700 ' + Math.round(cellPx * 0.62) + 'px Tahoma, "Microsoft Sans Serif", sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(cell.near, x + cellPx / 2, y + cellPx / 2 + 1);
      }
    } else {
      ctx.fillStyle = '#c0c0c0';
      ctx.fillRect(x, y, cellPx, cellPx);
      if (pressed && pressed.r === r && pressed.c === c) {
        /* 按压凹陷：上/左灰、下/右白（WIN 按下手感，即时反馈） */
        ctx.strokeStyle = '#808080'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + cellPx - 1); ctx.lineTo(x, y); ctx.lineTo(x + cellPx - 1, y); ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.beginPath(); ctx.moveTo(x + cellPx - 1, y); ctx.lineTo(x + cellPx - 1, y + cellPx - 1); ctx.lineTo(x, y + cellPx - 1); ctx.stroke();
      } else {
        /* 浮雕：上/左白、下/右灰（90 年代经典凸起） */
        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, y + cellPx - 1); ctx.lineTo(x, y); ctx.lineTo(x + cellPx - 1, y); ctx.stroke();
        ctx.strokeStyle = '#808080';
        ctx.beginPath(); ctx.moveTo(x + cellPx - 1, y); ctx.lineTo(x + cellPx - 1, y + cellPx - 1); ctx.lineTo(x, y + cellPx - 1); ctx.stroke();
      }
      if (cell.flag === 1 && cell.wrong) {
        ctx.fillStyle = '#ff0000'; ctx.fillRect(x + 1, y + 1, cellPx - 2, cellPx - 2);
        drawX(x, y, cellPx);
      } else if (cell.flag === 1) drawFlag(x, y, cellPx);
      else if (cell.flag === 2) {
        ctx.fillStyle = '#1f2328';
        ctx.font = '700 ' + Math.round(cellPx * 0.62) + 'px Tahoma, sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', x + cellPx / 2, y + cellPx / 2 + 1);
      } else if (state === 'lost' && cell.mine) drawMine(x, y, cellPx);
    }
  }
  function renderCell(r, c){ drawCell(r, c); }
  function renderAll(){
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++) drawCell(r, c);
  }

  /* ---------- 七段数码管 ---------- */
  var SEG = { a:[2,0,9,3], b:[10,2,3,9], c:[10,13,3,9], d:[2,20,9,3], e:[0,13,3,9], f:[0,2,3,9], g:[2,10,9,3] };
  var DIGITS = { 0:'abcdef', 1:'bc', 2:'abdeg', 3:'abcdg', 4:'bcfg', 5:'acdfg', 6:'acdefg', 7:'abc', 8:'abcdefg', 9:'abcdfg' };
  function digitSVG(d){
    var lit = DIGITS[d] || '';
    var s = '';
    for (var k in SEG) {
      var r = SEG[k], fill = lit.indexOf(k) >= 0 ? '#ff0000' : '#3d0a0a';
      s += '<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+fill+'" rx="1"/>';
    }
    return '<svg viewBox="0 0 13 23" width="13" height="23">'+s+'</svg>';
  }
  var DIGIT_SVGS = {};
  (function(){ for (var d = 0; d <= 9; d++) DIGIT_SVGS[d] = digitSVG(String(d)); })();
  function renderLcd(el, n){
    n = Math.max(0, Math.min(999, n));
    var str = ('000' + n).slice(-3);
    el.innerHTML = DIGIT_SVGS[str[0]] + DIGIT_SVGS[str[1]] + DIGIT_SVGS[str[2]];
  }

  /* ---------- 笑脸（DOM 保留） ---------- */
  function faceSVG(type){
    var eye = type === 'win'
      ? '<rect x="3.5" y="7" width="6.4" height="3.6" rx="1" fill="#000"/><rect x="16.1" y="7" width="6.4" height="3.6" rx="1" fill="#000"/><rect x="9.4" y="8.2" width="7.2" height="1.3" rx="0.6" fill="#000"/>'
      : '<circle cx="7.4" cy="9.2" r="1.7" fill="#000"/><circle cx="18.6" cy="9.2" r="1.7" fill="#000"/>';
    var mouth = '';
    if (type === 'normal') mouth = '<path d="M6.5 16.5 Q13 21 19.5 16.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    else if (type === 'wow') mouth = '<circle cx="13" cy="17.2" r="2.6" fill="#000"/>';
    else if (type === 'win') mouth = '<path d="M5.5 17.5 Q13 23 20.5 17.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    else mouth = '<path d="M6.5 19.5 Q13 15 19.5 19.5" stroke="#000" stroke-width="1.8" fill="none" stroke-linecap="round"/>';
    return '<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.6" fill="#ffd800" stroke="#000" stroke-width="1.5"/>' + eye + mouth + '</svg>';
  }
  var FACE_SVGS = {};
  (function(){
    FACE_SVGS.normal = faceSVG('normal');
    FACE_SVGS.wow = faceSVG('wow');
    FACE_SVGS.win = faceSVG('win');
    FACE_SVGS.lose = faceSVG('lose');
  })();
  function setFace(type){ faceBtn.innerHTML = FACE_SVGS[type] || FACE_SVGS.normal; }

  /* ---------- 棋盘数据 ---------- */
  function buildBoard(){
    board = [];
    for (var r = 0; r < ROWS; r++) {
      board[r] = [];
      for (var c = 0; c < COLS; c++) board[r][c] = { mine:false, open:false, flag:0, boom:false, wrong:false, near:0 };
    }
  }
  function countNear(r, c){
    var n = 0;
    for (var dr = -1; dr <= 1; dr++)
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) n++;
      }
    return n;
  }
  function placeMines(safeR, safeC){
    var placed = 0, guard = 0;
    while (placed < MINES && guard < 100000) {
      guard++;
      var r = Math.floor(Math.random() * ROWS);
      var c = Math.floor(Math.random() * COLS);
      if (r === safeR && c === safeC) continue;
      if (!board[r][c].mine) { board[r][c].mine = true; placed++; }
    }
    for (var rr = 0; rr < ROWS; rr++)
      for (var cc = 0; cc < COLS; cc++)
        board[rr][cc].near = countNear(rr, cc);
  }

  /* ---------- 动作 ---------- */
  function startTimer(){
    if (started) return;
    started = true;
    seconds = 0;
    renderLcd(lcdTimer, 0);
    timerId = setInterval(function(){
      seconds++;
      if (seconds > 999) seconds = 999;
      renderLcd(lcdTimer, seconds);
      if (seconds >= 999) stopTimer();
    }, 1000);
  }
  function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }

  function reveal(r, c){
    if (state === 'won' || state === 'lost') return;
    var cell = board[r][c];
    if (cell.open || cell.flag === 1) return;
    startTimer();
    if (cell.mine) { explode(r, c); return; }
    var queue = [[r, c]], qi = 0;
    while (qi < queue.length) {
      var p = queue[qi++];
      var pr = p[0], pc = p[1];
      var cc2 = board[pr][pc];
      if (cc2.open || cc2.flag === 1 || cc2.mine) continue;
      cc2.open = true;
      renderCell(pr, pc);
      if (cc2.near === 0) {
        for (var dr = -1; dr <= 1; dr++)
          for (var dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            var nr = pr + dr, nc = pc + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !board[nr][nc].open && board[nr][nc].flag !== 1)
              queue.push([nr, nc]);
          }
      }
    }
    checkWin();
  }
  function chord(r, c){
    var cell = board[r][c];
    if (!cell.open || cell.near === 0) return;
    var flags = 0;
    for (var dr = -1; dr <= 1; dr++)
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].flag === 1) flags++;
      }
    if (flags !== cell.near) return;
    for (var dr2 = -1; dr2 <= 1; dr2++)
      for (var dc2 = -1; dc2 <= 1; dc2++) {
        if (dr2 === 0 && dc2 === 0) continue;
        var nr2 = r + dr2, nc2 = c + dc2;
        if (nr2 >= 0 && nr2 < ROWS && nc2 >= 0 && nc2 < COLS) {
          var cc3 = board[nr2][nc2];
          if (!cc3.open && cc3.flag !== 1) reveal(nr2, nc2);
        }
      }
  }
  function cycleFlag(r, c){
    if (state === 'won' || state === 'lost') return;
    if (board[r][c].open) return;
    board[r][c].flag = (board[r][c].flag + 1) % 3;
    var cnt = 0;
    for (var rr = 0; rr < ROWS; rr++)
      for (var cc = 0; cc < COLS; cc++)
        if (board[rr][cc].flag === 1) cnt++;
    minesLeft = MINES - cnt;
    renderLcd(lcdMines, minesLeft);
    renderCell(r, c);
  }
  function explode(r, c){
    state = 'lost';
    stopTimer();
    board[r][c].boom = true;
    board[r][c].open = true;
    for (var rr = 0; rr < ROWS; rr++)
      for (var cc = 0; cc < COLS; cc++) {
        var cl = board[rr][cc];
        if (cl.flag === 1 && !cl.mine) cl.wrong = true;
      }
    renderAll();
    setFace('lose');
  }
  function checkWin(){
    var opened = 0;
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        if (board[r][c].open) opened++;
    if (opened === ROWS * COLS - MINES) {
      state = 'won';
      stopTimer();
      for (var rr = 0; rr < ROWS; rr++)
        for (var cc = 0; cc < COLS; cc++)
          if (board[rr][cc].mine && board[rr][cc].flag !== 1) { board[rr][cc].flag = 1; renderCell(rr, cc); }
      minesLeft = 0;
      renderLcd(lcdMines, 0);
      setFace('win');
      if (best === 0 || seconds < best) {
        best = seconds;
        try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {}
        renderBest(true);
      }
    }
  }

  /* ---------- 重置 ---------- */
  function reset(){
    stopTimer();
    state = 'ready'; started = false;
    seconds = 0; minesLeft = MINES;
    buildBoard();
    renderLcd(lcdMines, MINES);
    renderLcd(lcdTimer, 0);
    setFace('normal');
    renderAll();
  }

  /* ---------- 事件（坐标换算到 Canvas） ---------- */
  function cellFrom(e){
    var rect = canvas.getBoundingClientRect();
    var x, y;
    if (e.clientX !== undefined) { x = e.clientX - rect.left; y = e.clientY - rect.top; }
    else { x = e.offsetX; y = e.offsetY; }
    var c = Math.floor(x / cellPx), r = Math.floor(y / cellPx);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return null;
    return { r: r, c: c };
  }

  function doReveal(r, c){
    if (state === 'ready') {
      buildBoard();
      placeMines(r, c);
      state = 'playing';
    }
    var cell = board[r][c];
    if (cell.open) chord(r, c);
    else reveal(r, c);
    if (state === 'playing') setFace('normal');
  }

  gridEl.addEventListener('mousedown', function(e){
    if (e.button === 0) {
      if (suppressClick) { suppressClick = false; return; }
      var p = cellFrom(e);
      if (!p) return;
      if (state === 'lost' || state === 'won') return;
      pressed = { r: p.r, c: p.c };
      if (state === 'ready' || state === 'playing') setFace('wow');
      renderCell(p.r, p.c); // 立即画按压凹陷：按下瞬间即有反馈
    } else if (e.button === 2) {
      if (suppressContext) { suppressContext = false; return; }
      var p2 = cellFrom(e);
      if (!p2) return;
      if (state === 'lost' || state === 'won') return;
      if (state === 'ready') {
        buildBoard(); placeMines(p2.r, p2.c); state = 'playing'; setFace('normal');
      }
      cycleFlag(p2.r, p2.c); // 右键按下即插旗
    }
  });
  document.addEventListener('mouseup', function(e){
    if (e.button !== 0) return;
    var pr = pressed;
    pressed = null;
    if (!pr) { if (state === 'playing') setFace('normal'); return; }
    var p = cellFrom(e);
    var same = p && p.r === pr.r && p.c === pr.c;
    if (same && state !== 'lost' && state !== 'won') {
      doReveal(pr.r, pr.c);
    } else {
      if (state === 'playing') setFace('normal');
      renderCell(pr.r, pr.c); // 画回凸起
    }
  });
  gridEl.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if (suppressContext) suppressContext = false;
  });

  /* 移动端：长按插旗 */
  var touchTimer = null, touchStartXY = null;
  gridEl.addEventListener('touchstart', function(e){
    var t = e.changedTouches[0];
    touchStartXY = { x: t.clientX, y: t.clientY };
    var p = cellFrom(e);
    if (!p) return;
    touchTimer = setTimeout(function(){
      if (state === 'lost' || state === 'won') { suppressClick = true; return; }
      if (state === 'ready') {
        buildBoard(); placeMines(p.r, p.c); state = 'playing'; setFace('normal');
      }
      cycleFlag(p.r, p.c);
      suppressClick = true;
      suppressContext = true;
      touchTimer = null;
    }, 500);
  }, { passive: true });
  gridEl.addEventListener('touchmove', function(){
    if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
  }, { passive: true });
  gridEl.addEventListener('touchend', function(e){
    if (touchTimer) { clearTimeout(touchTimer); touchTimer = null; }
    if (touchStartXY) {
      var t = e.changedTouches[0];
      var dx = t.clientX - touchStartXY.x, dy = t.clientY - touchStartXY.y;
      if (Math.abs(dx) > 10 || Math.abs(dy) > 10) suppressClick = true;
      touchStartXY = null;
    }
  }, { passive: true });

  faceBtn.addEventListener('click', reset);

  /* ---------- 自适应尺寸 ---------- */
  function resize(){
    var avail = Math.min(window.innerWidth - 24, 640);
    cellPx = Math.max(10, Math.floor((avail - 6) / COLS));
    cellPx = Math.min(cellPx, 22);
    dpr = window.devicePixelRatio || 1;
    var w = COLS * cellPx, h = ROWS * cellPx;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    renderAll();
  }
  window.addEventListener('resize', resize);

  /* ---------- 启动 ---------- */
  buildBoard();
  resize();
