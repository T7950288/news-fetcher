<!-- v3-trigger -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>围棋 · KataGo 人机对弈</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a3a6c'/%3E%3Ctext x='32' y='44' font-size='32' text-anchor='middle' fill='white'%3E棋%3C/text%3E%3C/svg%3E">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
         background:#e8d8b5; color:#1a1a1a; line-height:1.4; height:100dvh; overflow:hidden;
         display:flex; flex-direction:column; }
  .topbar { flex:none; display:flex; align-items:center; gap:8px; padding:6px 10px;
            background:#fff; border-bottom:1px solid #e0dccb; }
  .back { text-decoration:none; color:#1a3a6c; font-size:16px; font-weight:700;
          padding:4px 10px 4px 4px; white-space:nowrap; }
  .spacer { flex:1; }
  .tbtn { border:1px solid #d5cfbc; background:#f7f4ec; border-radius:8px; padding:6px 12px;
          font-size:14px; color:#333; cursor:pointer; white-space:nowrap; }
  .tbtn:active { transform:scale(.96); }
  .tbtn.primary { background:#1a3a6c; color:#fff; border-color:#1a3a6c; }
  .tbtn.danger { background:#f44336; color:#fff; border-color:#f44336; }
  .tbtn:disabled { opacity:.45; cursor:wait; }
  .sel { border:1px solid #d5cfbc; background:#fff; border-radius:8px; padding:6px 8px;
         font-size:14px; color:#333; }
  .statusbar { flex:none; display:flex; align-items:center; gap:10px; padding:4px 12px;
               background:#fff; border-bottom:1px solid #e0dccb; font-size:13px;
               flex-wrap:wrap; }
  .badge { font-weight:700; color:#1a3a6c; }
  .badge.ai { color:#a50e0e; }
  .badge.load { color:#b8860b; }
  .small { color:#666; }
  .board-wrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
                padding:8px; position:relative; }
  #board { display:block; touch-action:manipulation; cursor:pointer;
           background:transparent; }
  .loading-mask { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                  background:rgba(232,216,181,.92); z-index:5; }
  .loading-card { background:#fff; border-radius:12px; padding:18px 26px; text-align:center;
                  box-shadow:0 4px 18px rgba(0,0,0,.12); max-width:82%; }
  .loading-card .t { font-size:15px; font-weight:700; color:#1a3a6c; margin-bottom:6px; }
  .loading-card .s { font-size:12px; color:#666; line-height:1.6; }
  .bar { width:200px; max-width:80%; height:8px; background:#eee; border-radius:4px;
         margin:10px auto 0; overflow:hidden; }
  .bar > i { display:block; height:100%; width:0; background:#4CAF50; transition:width .3s; }
  .result-box { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%);
                background:#fff; border-radius:12px; padding:16px 24px; text-align:center;
                box-shadow:0 4px 20px rgba(0,0,0,.18); z-index:6; display:none; }
  .result-box .rt { font-size:16px; font-weight:700; margin-bottom:8px; color:#1a3a6c; }
  .result-box .rs { font-size:13px; color:#333; margin-bottom:10px; }
  .result-box .btn { border:none; background:#1a3a6c; color:#fff; border-radius:8px;
                     padding:8px 22px; font-size:14px; cursor:pointer; }
  @media (max-width:600px){
    .topbar { gap:5px; padding:4px 6px; }
    .back { font-size:14px; padding:2px 6px 2px 2px; }
    .tbtn { padding:5px 8px; font-size:13px; }
    .sel { padding:5px 6px; font-size:13px; }
    .statusbar { font-size:12px; gap:7px; padding:3px 8px; }
    .board-wrap { padding:4px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back" href="index.html">← 棋类</a>
  <select class="sel" id="selDiff">
    <option value="40">容易</option>
    <option value="120" selected>中等</option>
    <option value="300">困难</option>
  </select>
  <select class="sel" id="selColor">
    <option value="1" selected>执黑（先手）</option>
    <option value="2">执白（后手）</option>
  </select>
  <div class="spacer"></div>
  <button class="tbtn" id="btnNew">新局</button>
  <button class="tbtn" id="btnUndo" disabled>悔棋</button>
  <button class="tbtn" id="btnPass" disabled>虚手</button>
  <button class="tbtn danger" id="btnResign" disabled>认输</button>
</div>

<div class="statusbar">
  <span class="badge" id="turnBadge">准备开始</span>
  <span class="small" id="moveInfo">手数 0</span>
  <span class="small" id="captureInfo">提子 黑0 / 白0</span>
  <span class="badge load" id="engInfo">引擎加载中…</span>
  <span class="small" id="winrateInfo"></span>
</div>

<div class="board-wrap">
  <canvas id="board"></canvas>
  <div class="loading-mask" id="loadingMask">
    <div class="loading-card">
      <div class="t" id="loadTitle">正在加载围棋引擎…</div>
      <div class="s" id="loadSub">首次加载需下载 AI 模型（约 12MB），请耐心等待<br>之后每次打开都是秒开</div>
      <div class="bar"><i id="loadBar"></i></div>
    </div>
  </div>
  <div class="result-box" id="resultBox">
    <div class="rt" id="resultTitle"></div>
    <div class="rs" id="resultText"></div>
    <button class="btn" id="btnResultNew">再来一局</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/gh/t7950288/news-fetcher@main/chess/vendor/tf.min.js"></script>
<script src="go_engine.js"></script>
<script src="go_ai.js"></script>
<script>
(function () {
  "use strict";
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const N = 19;

  let board = null;
  let playerColor = 1;
  let aiColor = 2;
  let gameOver = false;
  let aiThinking = false;
  let engineReady = false;
  let playouts = 120;
  let cell = 30, ox = 0, oy = 0;
  const komi = 7.5;

  const $ = id => document.getElementById(id);
  const badge = $("turnBadge"), engInfo = $("engInfo"), moveInfo = $("moveInfo");
  const capInfo = $("captureInfo"), winrateInfo = $("winrateInfo");

  const ai = new GoAI();
  const MODEL_URL = "https://cdn.jsdelivr.net/gh/t7950288/news-fetcher@main/chess/go_model/b10c128/model.json";

  async function loadEngine() {
    engInfo.textContent = "引擎加载中…";
    engInfo.className = "badge load";
    try {
      const backend = await ai.load(MODEL_URL);
      engineReady = true;
      engInfo.textContent = "引擎就绪" + (backend === "webgl" ? "（GPU）" : "（CPU）");
      engInfo.className = "badge";
      $("loadingMask").style.display = "none";
      startNewGame(true);
    } catch (e) {
      console.error(e);
      $("loadTitle").textContent = "引擎加载失败";
      $("loadSub").textContent = "请检查网络后刷新重试";
    }
  }

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    cell = Math.floor(Math.min((W - 16) / (N + 0.6), (H - 16) / (N + 0.6)));
    if (cell < 14) cell = Math.min((W - 8) / N, (H - 8) / N);
    const bw = (N - 1) * cell + 24, bh = (N - 1) * cell + 24;
    canvas.width = bw * dpr; canvas.height = bh * dpr;
    canvas.style.width = bw + "px"; canvas.style.height = bh + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ox = 12; oy = 12;
    drawBoard();
  }

  function drawBoard() {
    const bw = (N - 1) * cell + 24;
    ctx.clearRect(0, 0, bw, bw);
    ctx.fillStyle = "#e8d8b5";
    ctx.fillRect(0, 0, bw, bw);
    ctx.strokeStyle = "#5a4a2e";
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      const p = ox + i * cell;
      ctx.beginPath(); ctx.moveTo(ox, p); ctx.lineTo(ox + (N - 1) * cell, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, oy); ctx.lineTo(p, oy + (N - 1) * cell); ctx.stroke();
    }
    ctx.fillStyle = "#5a4a2e";
    const stars = [3, 9, 15];
    for (const sr of stars) for (const sc of stars) {
      ctx.beginPath();
      ctx.arc(ox + sc * cell, oy + sr * cell, Math.max(2.5, cell * 0.09), 0, Math.PI * 2);
      ctx.fill();
    }
    if (!board) return;
    const last = board.moveHistory.length ? board.moveHistory[board.moveHistory.length - 1] : null;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = board.grid[r][c];
        if (v === 0) continue;
        const px = ox + c * cell, py = oy + r * cell;
        const rad = cell * 0.46;
        const g = ctx.createRadialGradient(px - rad * .35, py - rad * .35, rad * .1, px, py, rad);
        if (v === 1) { g.addColorStop(0, "#3a3a3a"); g.addColorStop(1, "#000"); }
        else { g.addColorStop(0, "#fff"); g.addColorStop(1, "#d8d8d8"); }
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = v === 1 ? "#000" : "#bbb";
        ctx.lineWidth = 0.8; ctx.stroke();
        if (last && last.row === r && last.col === c) {
          ctx.fillStyle = "#e53935";
          ctx.beginPath(); ctx.arc(px, py, Math.max(2, cell * 0.08), 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  canvas.addEventListener("click", (e) => {
    if (!engineReady || gameOver || aiThinking) return;
    const st = sideToMove();
    if (st !== playerColor) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const c = Math.round((mx - ox) / cell), r = Math.round((my - oy) / cell);
    if (r < 0 || r >= N || c < 0 || c >= N) return;
    const { valid } = board.isValidMove(r, c, playerColor);
    if (!valid) return;
    board.play(r, c, playerColor);
    updateUI();
    requestAIMove();
  });

  function sideToMove() {
    return board.moveHistory.length % 2 === 0 ? 1 : 2;
  }

  async function requestAIMove() {
    if (!engineReady || gameOver) return;
    aiThinking = true;
    badge.textContent = "AI 思考中…";
    badge.className = "badge ai";
    setBtns(false);
    try {
      const result = await ai.search(board, komi, playouts);
      if (gameOver) return;
      if (result.move.pass) {
        board.passMove(aiColor);
        if (board.passCount >= 2) { finishGame(); return; }
      } else {
        board.play(result.move.r, result.move.c, aiColor);
        if (board.passCount >= 2) board.passCount = 0;
      }
      const wr = Math.round(result.winrate * 100);
      winrateInfo.textContent = "AI 胜率 " + wr + "%";
    } catch (e) {
      console.error(e);
      winrateInfo.textContent = "AI 出错，请重试";
    }
    aiThinking = false;
    updateUI();
    setBtns(true);
    if (!gameOver && sideToMove() === playerColor) {
      badge.textContent = (playerColor === 1 ? "黑棋" : "白棋") + "行棋（你）";
      badge.className = "badge";
    }
  }

  function finishGame() {
    gameOver = true;
    const res = board.countTerritory();
    const blackTotal = res.blackScore;
    const whiteTotal = res.whiteScore + komi;
    let title;
    if (blackTotal > whiteTotal) title = "黑棋胜";
    else if (whiteTotal > blackTotal) title = "白棋胜";
    else title = "和棋";
    $("resultTitle").textContent = title;
    $("resultText").textContent = "黑 " + blackTotal + " 目 ｜ 白 " + whiteTotal + " 目（含贴目 " + komi + "）";
    $("resultBox").style.display = "block";
    badge.textContent = "对局结束";
    badge.className = "badge";
    winrateInfo.textContent = "";
    setBtns(false);
    drawBoard();
  }

  function updateUI() {
    const st = sideToMove();
    const isPlayer = st === playerColor;
    if (!gameOver) {
      badge.textContent = (st === 1 ? "黑棋" : "白棋") + (isPlayer ? "行棋（你）" : "行棋（AI）");
      badge.className = isPlayer ? "badge" : "badge ai";
    }
    moveInfo.textContent = "手数 " + board.moveHistory.length;
    capInfo.textContent = "提子 黑" + board.captures[1] + " / 白" + board.captures[2];
    drawBoard();
  }

  function setBtns(on) {
    $("btnPass").disabled = !on || gameOver;
    $("btnUndo").disabled = !on || gameOver || board.moveHistory.length === 0;
    $("btnResign").disabled = !on || gameOver;
  }

  function startNewGame(auto) {
    board = new GoBoard(N);
    gameOver = false;
    aiThinking = false;
    winrateInfo.textContent = "";
    $("resultBox").style.display = "none";
    playerColor = parseInt($("selColor").value);
    aiColor = 3 - playerColor;
    playouts = parseInt($("selDiff").value);
    updateUI();
    setBtns(true);
    if (auto) {
      $("btnNew").disabled = false;
      if (aiColor === 1) requestAIMove();
    } else {
      $("btnNew").disabled = true;
      if (aiColor === 1) requestAIMove();
      else $("btnNew").disabled = false;
    }
  }

  $("btnNew").addEventListener("click", () => startNewGame(false));
  $("btnResultNew").addEventListener("click", () => startNewGame(false));
  $("btnPass").addEventListener("click", () => {
    if (!engineReady || gameOver || aiThinking) return;
    if (sideToMove() !== playerColor) return;
    board.passMove(playerColor);
    updateUI();
    if (board.passCount >= 2) { finishGame(); return; }
    requestAIMove();
  });
  $("btnUndo").addEventListener("click", () => {
    if (!engineReady || gameOver || aiThinking) return;
    board.undo();
    if (sideToMove() === aiColor && board.moveHistory.length > 0) board.undo();
    updateUI();
    setBtns(true);
  });
  $("btnResign").addEventListener("click", () => {
    if (!engineReady || gameOver) return;
    const winner = aiColor === 1 ? "白棋" : "黑棋";
    $("resultTitle").textContent = "你认输了，" + winner + "胜";
    $("resultText").textContent = "继续加油！再来一局？";
    $("resultBox").style.display = "block";
    gameOver = true;
    badge.textContent = "对局结束";
    setBtns(false);
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  loadEngine();
})();
</script>
</body>
</html>
