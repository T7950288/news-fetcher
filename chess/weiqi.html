<script src="https://cdn.jsdelivr.net/gh/t7950288/news-fetcher@main/chess/vendor/tf.min.js"></script>
<script src="go_engine.js"></script>
<script>
/* ============================================================
 * go_ai.js —— 围棋 AI 引擎（KataGo b10c128 神经网络 + MCTS）
 * 模型：KataGo b10c128（TensorFlow.js graph model，来自 zengo 开源项目，
 *       模型权重为 KataGo 官方 kata1-b10c128 系列）
 * 输入：bin_inputs [1,361,22]（22 通道）+ global_inputs [1,19]
 * 输出：policy[1,2,362]  value[1,3]  miscvalues[1,10]  ownership[1,19,19]
 * 编码参考 kata-model-js（maksimKorzh）的 KataGo 输入实现
 * ============================================================ */

class GoNode {
  constructor(parent, move, prior) {
    this.parent = parent;
    this.move = move;        // {r,c} 或 {pass:true}
    this.prior = prior;
    this.N = 0;
    this.W = 0;
    this.Q = 0;
    this.children = null;    // Map，首次展开时创建
  }
}

class GoAI {
  constructor() {
    this.model = null;
    this.ready = false;
    this.backend = "cpu";
    this.c_puct = 1.2;
    this._passKey = "pass";
    this._key = (r, c) => r * 19 + c;
  }

  /* ---------- 模型加载 ---------- */
  async load(modelUrl) {
    try { await tf.setBackend("webgl"); } catch (e) { /* 无 WebGL 时回退 */ }
    if (tf.getBackend() === "webgl") this.backend = "webgl";
    this.model = await tf.loadGraphModel(modelUrl);
    this.ready = true;
    return this.backend;
  }

  /* ---------- KataGo 输入编码（22 通道 + 19 全局） ---------- */
  // board: GoBoard；sideToMove: 当前行棋方（1黑/2白）；komi: 贴目
  encodePosition(board, sideToMove, komi) {
    const N = 19, CH = 22;
    const bin = new Float32Array(N * N * CH);
    const global = new Float32Array(19);
    const cur = sideToMove;          // KataGo 视角 = 当前行棋方
    const opp = 3 - cur;
    const hist = board.moveHistory;

    // 预计算黑白双方各点的气数（组气）
    const libsMap = this._computeLibertyMap(board, cur, opp);

    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const cell = board.grid[r][c];
        const base = (r * N + c) * CH;
        bin[base + 0] = 1.0;                       // ch0: 在棋盘上
        if (cell === cur)  bin[base + 1] = 1.0;    // ch1: 当前方石
        if (cell === opp)  bin[base + 2] = 1.0;    // ch2: 对方石
        if (cell !== 0) {
          const lb = libsMap[r][c];
          if (lb === 1) bin[base + 3] = 1.0;
          if (lb === 2) bin[base + 4] = 1.0;
          if (lb === 3) bin[base + 5] = 1.0;
        }
      }
    }
    // ch6: ko 点
    if (board.koPoint) {
      const [kr, kc] = board.koPoint;
      bin[(kr * N + kc) * CH + 6] = 1.0;
    }
    // ch9-13: 最近 5 手（交替：最近一手是对方，接着是当前方……）
    // global[0-4]: 最近 5 手是否 pass
    let idx = hist.length - 1;
    const expected = [opp, cur, opp, cur, opp];    // 最近一手是对方下的
    for (let ch = 0; ch < 5; ch++) {
      if (idx < 0) break;
      const mv = hist[idx];
      if (mv.color !== expected[ch]) break;
      if (mv.row < 0 || mv.col < 0) {
        global[ch] = 1.0;                          // pass 标记
      } else {
        bin[(mv.row * N + mv.col) * CH + (9 + ch)] = 1.0;
      }
      idx--;
    }
    // global[5]: komi（当前方视角）
    const selfKomi = (cur === 2) ? (komi + 1) : (-komi);
    global[5] = selfKomi / 20.0;

    return {
      bin: tf.tensor(bin, [1, N * N, CH], "float32"),
      glob: tf.tensor(global, [1, 19], "float32")
    };
  }

  _computeLibertyMap(board, cur, opp) {
    const N = 19;
    const libs = [];
    for (let r = 0; r < N; r++) libs.push(new Int32Array(N));
    const visited = [];
    for (let r = 0; r < N; r++) visited.push(new Uint8Array(N));
    for (const color of [cur, opp]) {
      for (let r = 0; r < N; r++) {
        for (let c = 0; c < N; c++) {
          if (board.grid[r][c] !== color || visited[r][c]) continue;
          // BFS 找组 + 气
          const group = [];
          const libSet = new Set();
          const queue = [[r, c]];
          visited[r][c] = 1;
          let qi = 0;
          while (qi < queue.length) {
            const [cr, cc] = queue[qi]; qi++;
            group.push([cr, cc]);
            const nbs = this._nbrs(cr, cc, N);
            for (const [nr, nc] of nbs) {
              if (board.grid[nr][nc] === 0) libSet.add(nr * N + nc);
              else if (board.grid[nr][nc] === color && !visited[nr][nc]) {
                visited[nr][nc] = 1;
                queue.push([nr, nc]);
              }
            }
          }
          const lb = libSet.size;
          for (const [gr, gc] of group) libs[gr][gc] = lb;
        }
      }
    }
    return libs;
  }

  _nbrs(r, c, N) {
    const res = [];
    if (r > 0) res.push([r - 1, c]);
    if (r < N - 1) res.push([r + 1, c]);
    if (c > 0) res.push([r, c - 1]);
    if (c < N - 1) res.push([r, c + 1]);
    return res;
  }

  /* ---------- 神经网络前向 ---------- */
  async predict(board, sideToMove, komi) {
    const { bin, glob } = this.encodePosition(board, sideToMove, komi);
    try {
      const res = await this.model.executeAsync({
        "swa_model/bin_inputs": bin,
        "swa_model/global_inputs": glob
      });
      // 输出顺序：0=ownership 1=policy 2=miscvalues 3=value
      const policyFlat = await res[1].data();
      const valueFlat = await res[3].data();
      const miscFlat = await res[2].data();
      // 当前方 policy：前 362（361 点 + pass）
      const policy = new Float32Array(362);
      for (let i = 0; i < 362; i++) policy[i] = policyFlat[i];
      // value：win/loss/no-result 的 softmax 差值（当前方视角）
      const a = Math.exp(valueFlat[0]), b = Math.exp(valueFlat[1]), c = Math.exp(valueFlat[2] || 0);
      const v = (a - b) / (a + b + c);
      const scoreLead = miscFlat.length > 2 ? miscFlat[2] * 20.0 : 0;
      bin.dispose(); glob.dispose();
      for (const t of res) if (t && t.dispose) t.dispose();
      return { policy, value: v, scoreLead };
    } catch (e) {
      bin.dispose(); glob.dispose();
      throw e;
    }
  }

  /* ---------- MCTS 搜索 ----------
   * targetMs: 目标思考时长（毫秒）。按实测单次前向耗时自适应 playouts，
   * 慢机器控思考时间，快机器自动加搜索量变强。 */
  async search(board, komi, targetMs, side) {
    // 颜色显式传入（悔棋接管等场景棋谱奇偶可能错乱，不能靠棋谱推断）
    if (!side) {
      const last = board.moveHistory[board.moveHistory.length - 1];
      side = last ? 3 - last.color : 1;
    }
    const root = new GoNode(null, null, 0);
    const initBoard = board.copy();

    // 根评估 + 测速
    let t0 = performance.now();
    const rootEval = await this.predict(initBoard, side, komi);
    const perPredict = Math.max(performance.now() - t0, 10);
    root.children = this._expand(initBoard, side, komi, rootEval.policy);
    root.isExpanded = true;

    // 自适应 playouts：目标时间 / 单次前向耗时，上下限 8..400
    let playouts = Math.floor(targetMs / perPredict);
    // 动态下限：慢机器 1 次保底（秒级响应），快机器至少 4 次保棋力
    let lower = Math.max(1, Math.min(5, Math.floor(1000 / perPredict)));
    if (playouts < lower) playouts = lower;
    if (playouts > 400) playouts = 400;
    const realPlayouts = playouts;

    let done = 0;
    for (let i = 0; i < realPlayouts; i++) {
      await this._simulate(root, initBoard.copy(), side, komi);
      done++;
    }

    // 选子：子节点访问数最多
    let best = null, bestN = -1;
    for (const child of root.children.values()) {
      if (child.N > bestN) { bestN = child.N; best = child; }
    }
    const move = best ? { r: best.move.r, c: best.move.c, pass: !!best.move.pass } : { pass: true };
    // 胜率（根视角）
    const wr = 1 / (1 + Math.exp(-root.Q * 3.0));
    return { move, winrate: wr, playouts: done, targetPlayouts: realPlayouts, rootQ: root.Q, scoreLead: rootEval.scoreLead };
  }

  _expand(board, side, komi, policy) {
    const children = new Map();
    const moves = board.getLegalMoves(side);
    for (const [r, c] of moves) {
      const p = Math.max(policy[r * 19 + c], 1e-6);
      children.set(this._key(r, c), new GoNode(null, { r, c }, p));
    }
    const pp = Math.max(policy[361], 1e-6);
    children.set(this._passKey, new GoNode(null, { pass: true }, pp));
    return children;
  }

  async _simulate(root, board, side, komi) {
    let node = root, b = board, s = side;
    const path = [root];
    while (node.isExpanded && node.children.size > 0) {
      const child = this._select(node);
      path.push(child);
      if (child.move.pass) b.passMove(s);
      else b.play(child.move.r, child.move.c, s);
      s = 3 - s;
      node = child;
    }
    let value;
    if (!node.isExpanded) {
      const evalR = await this.predict(b, s, komi);
      node.children = this._expand(b, s, komi, evalR.policy);
      node.isExpanded = true;
      value = evalR.value;
    } else {
      value = 0; // 无可走分支（罕见）
    }
    for (let i = path.length - 1; i >= 0; i--) {
      const n = path[i];
      n.N++;
      n.W += value;
      n.Q = n.W / n.N;
      value = -value;
    }
    return value;
  }

  _select(node) {
    let best = null, bestVal = -Infinity;
    const sq = Math.sqrt(node.N + 1);
    for (const child of node.children.values()) {
      const u = this.c_puct * child.prior * sq / (1 + child.N);
      const val = child.Q + u;
      if (val > bestVal) { bestVal = val; best = child; }
    }
    return best;
  }
}

</script>

<script>
(function () {
  "use strict";
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const N = 19;

  let board = null;
  let playerColor = 1;
  let aiColor = 2;
  let gameOver = false;
  let aiThinking = false;
  let engineReady = false;
  let playerTakesTurn = false;  // 悔棋后若轮到 AI，由玩家先下
  let targetMs = 30000;
  let cell = 30, ox = 0, oy = 0;
  const komi = 7.5;

  const $ = id => document.getElementById(id);
  const badge = $("turnBadge"), engInfo = $("engInfo"), moveInfo = $("moveInfo");
  const capInfo = $("captureInfo"), winrateInfo = $("winrateInfo");

  const ai = new GoAI();
  const MODEL_URL = "https://cdn.jsdelivr.net/gh/t7950288/news-fetcher@main/chess/go_model/b10c128/model.json";

  async function loadEngine() {
    engInfo.textContent = "引擎加载中…";
    engInfo.className = "badge load";
    try {
      const backend = await ai.load(MODEL_URL);
      engineReady = true;
      engInfo.textContent = window.innerWidth <= 600 ? "引擎就绪" : "引擎就绪" + (backend === "webgl" ? "（GPU）" : "（CPU）");
      engInfo.className = "badge";
      $("loadingMask").style.display = "none";
      startNewGame(true);
    } catch (e) {
      console.error(e);
      $("loadTitle").textContent = "引擎加载失败";
      $("loadSub").textContent = "请检查网络后刷新重试";
    }
  }

  function resizeCanvas() {
    const wrap = canvas.parentElement;
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    const isMobile = window.innerWidth <= 600;
    if (isMobile) {
      // 手机：贴边最大化（四周仅留半个格子的边距）
      cell = Math.floor(Math.min(W / 19.2, H / 19.2));
      if (cell < 9) cell = Math.floor(Math.min(W / 19, H / 19));
      ox = 8; oy = 8;
    } else {
      cell = Math.floor(Math.min((W - 16) / (N + 0.6), (H - 16) / (N + 0.6)));
      if (cell < 14) cell = Math.min((W - 8) / N, (H - 8) / N);
      ox = 12; oy = 12;
    }
    const bw = (N - 1) * cell + ox * 2, bh = (N - 1) * cell + oy * 2;
    canvas.width = bw * dpr; canvas.height = bh * dpr;
    canvas.style.width = bw + "px"; canvas.style.height = bh + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBoard();
  }

  function drawBoard() {
    const bw = (N - 1) * cell + 24;
    ctx.clearRect(0, 0, bw, bw);
    ctx.fillStyle = "#e8d8b5";
    ctx.fillRect(0, 0, bw, bw);
    ctx.strokeStyle = "#5a4a2e";
    ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      const p = ox + i * cell;
      ctx.beginPath(); ctx.moveTo(ox, p); ctx.lineTo(ox + (N - 1) * cell, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, oy); ctx.lineTo(p, oy + (N - 1) * cell); ctx.stroke();
    }
    ctx.fillStyle = "#5a4a2e";
    const stars = [3, 9, 15];
    for (const sr of stars) for (const sc of stars) {
      ctx.beginPath();
      ctx.arc(ox + sc * cell, oy + sr * cell, Math.max(2.5, cell * 0.09), 0, Math.PI * 2);
      ctx.fill();
    }
    if (!board) return;
    const last = board.moveHistory.length ? board.moveHistory[board.moveHistory.length - 1] : null;
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const v = board.grid[r][c];
        if (v === 0) continue;
        const px = ox + c * cell, py = oy + r * cell;
        const rad = cell * 0.46;
        const g = ctx.createRadialGradient(px - rad * .35, py - rad * .35, rad * .1, px, py, rad);
        if (v === 1) { g.addColorStop(0, "#3a3a3a"); g.addColorStop(1, "#000"); }
        else { g.addColorStop(0, "#fff"); g.addColorStop(1, "#d8d8d8"); }
        ctx.beginPath(); ctx.arc(px, py, rad, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
        ctx.strokeStyle = v === 1 ? "#000" : "#bbb";
        ctx.lineWidth = 0.8; ctx.stroke();
        if (last && last.row === r && last.col === c) {
          ctx.fillStyle = "#e53935";
          ctx.beginPath(); ctx.arc(px, py, Math.max(2, cell * 0.08), 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  canvas.addEventListener("click", (e) => {
    if (!engineReady || gameOver || aiThinking) return;
    const st = sideToMove();
    if (st !== playerColor && !playerTakesTurn) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const c = Math.round((mx - ox) / cell), r = Math.round((my - oy) / cell);
    if (r < 0 || r >= N || c < 0 || c >= N) return;
    const { valid } = board.isValidMove(r, c, playerColor);
    if (!valid) return;
    board.play(r, c, playerColor);
    playerTakesTurn = false;
    updateUI();
    requestAIMove();
  });

  function sideToMove() {
    // 按最后一手颜色推断行棋方（悔棋/接管会打破手数奇偶，不能按长度推断）
    const last = board.moveHistory[board.moveHistory.length - 1];
    return last ? 3 - last.color : 1;
  }

  async function requestAIMove() {
    if (!engineReady || gameOver) return;
    aiThinking = true;
    badge.textContent = "AI 思考中…";
    badge.className = "badge ai";
    setBtns(false);
    try {
      const t = board.moveHistory.length < 6 ? 2500 : targetMs;
      const result = await ai.search(board, komi, t, aiColor);
      if (gameOver) return;
      if (result.move.pass) {
        board.passMove(aiColor);
        if (board.passCount >= 2) { finishGame(); return; }
      } else {
        board.play(result.move.r, result.move.c, aiColor);
        if (board.passCount >= 2) board.passCount = 0;
      }
      const wr = Math.round(result.winrate * 100);
      winrateInfo.textContent = "AI 胜率 " + wr + "%（思考 " + result.playouts + " 次）";
    } catch (e) {
      console.error(e);
      winrateInfo.textContent = "AI 出错，请重试";
    }
    aiThinking = false;
    updateUI();
    setBtns(true);
    if (!gameOver && sideToMove() === playerColor) {
      badge.textContent = (playerColor === 1 ? "黑棋" : "白棋") + "行棋（你）";
      badge.className = "badge";
    }
  }

  function finishGame() {
    gameOver = true;
    const res = board.countTerritory();
    const blackTotal = res.blackScore;
    const whiteTotal = res.whiteScore + komi;
    let title;
    if (blackTotal > whiteTotal) title = "黑棋胜";
    else if (whiteTotal > blackTotal) title = "白棋胜";
    else title = "和棋";
    $("resultTitle").textContent = title;
    $("resultText").textContent = "黑 " + blackTotal.toFixed(1) + " 目 ｜ 白 " + whiteTotal.toFixed(1) + " 目（含贴目 " + komi + "）";
    $("resultBox").style.display = "block";
    $("btnResultGo").style.display = "none";
    $("btnResultNew").style.display = "";
    badge.textContent = "对局结束";
    badge.className = "badge";
    winrateInfo.textContent = "";
    setBtns(false);
    drawBoard();
  }

  function updateUI() {
    const st = sideToMove();
    const isPlayer = st === playerColor;
    if (!gameOver) {
      badge.textContent = (st === 1 ? "黑棋" : "白棋") + (isPlayer ? "行棋（你）" : "行棋（AI）");
      badge.className = isPlayer ? "badge" : "badge ai";
    }
    moveInfo.textContent = "手数 " + board.moveHistory.length;
    capInfo.textContent = "提子 黑" + board.captures[1] + " / 白" + board.captures[2];
    drawBoard();
  }

  function setBtns(on) {
    $("btnPass").disabled = !on || gameOver;
    $("btnUndo").disabled = !on || gameOver || board.moveHistory.length === 0;
    $("btnResign").disabled = !on || gameOver;
  }

  function startNewGame(auto) {
    board = new GoBoard(N);
    gameOver = false;
    aiThinking = false;
    playerTakesTurn = false;
    winrateInfo.textContent = "";
    $("resultBox").style.display = "none";
    playerColor = parseInt($("selColor").value);
    aiColor = 3 - playerColor;
    targetMs = parseInt($("selDiff").value);
    updateUI();
    setBtns(true);
    if (auto) {
      $("btnNew").disabled = false;
      if (aiColor === 1) requestAIMove();
    } else {
      $("btnNew").disabled = true;
      if (aiColor === 1) requestAIMove();
      else $("btnNew").disabled = false;
    }
  }

  $("btnNew").addEventListener("click", () => startNewGame(false));
  $("btnCount").addEventListener("click", () => {
    if (!engineReady || gameOver || board.moveHistory.length === 0) return;
    showForm(true);
  });
  $("btnResultGo").addEventListener("click", () => {
    $("resultBox").style.display = "none";
    $("btnResultGo").style.display = "none";
    $("btnResultNew").style.display = "none";
  });
  function showForm(isLive) {
    const res = board.countTerritory();
    const blackTotal = res.blackScore;
    const whiteTotal = res.whiteScore + komi;
    let title;
    if (blackTotal > whiteTotal) title = "黑棋领先 " + (blackTotal - whiteTotal).toFixed(1) + " 目";
    else if (whiteTotal > blackTotal) title = "白棋领先 " + (whiteTotal - blackTotal).toFixed(1) + " 目";
    else title = "形势持平";
    $("resultTitle").textContent = title;
    $("resultText").textContent = "黑 " + blackTotal.toFixed(1) + " 目 ｜ 白 " + whiteTotal.toFixed(1) + " 目（含贴目 " + komi + "）" + (isLive ? "\n（对局未结束，数目仅作参考）" : "");
    if (isLive) {
      $("btnResultGo").style.display = "";
      $("btnResultNew").style.display = "none";
    } else {
      $("btnResultGo").style.display = "none";
      $("btnResultNew").style.display = "";
    }
    $("resultBox").style.display = "block";
  }
  $("btnResultNew").addEventListener("click", () => startNewGame(false));
  $("btnPass").addEventListener("click", () => {
    if (!engineReady || gameOver || aiThinking) return;
    if (sideToMove() !== playerColor && !playerTakesTurn) return;
    playerTakesTurn = false;
    board.passMove(playerColor);
    updateUI();
    if (board.passCount >= 2) { finishGame(); return; }
    requestAIMove();
  });
  $("btnUndo").addEventListener("click", () => {
    if (!engineReady || gameOver || aiThinking) return;
    board.undo();  // 每点一次退一手，可连续点
    playerTakesTurn = false;
    updateUI();
    setBtns(true);
    if (!gameOver && sideToMove() === aiColor) {
      // 轮到 AI 也不让它先下：由玩家先下一手
      playerTakesTurn = true;
      badge.textContent = (playerColor === 1 ? "黑棋" : "白棋") + "行棋（你）";
      badge.className = "badge";
    }
  });
  $("btnResign").addEventListener("click", () => {
    if (!engineReady || gameOver) return;
    const winner = aiColor === 1 ? "白棋" : "黑棋";
    $("resultTitle").textContent = "你认输了，" + winner + "胜";
    $("resultText").textContent = "继续加油！再来一局？";
    $("resultBox").style.display = "block";
    gameOver = true;
    badge.textContent = "对局结束";
    setBtns(false);
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  loadEngine();
})();
</script>
</body>
</html>
