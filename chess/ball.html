<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>圆内弹力球</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #14141c;
    color: #e8e8f0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px; overflow: hidden;
  }
  .toolbar {
    width: 100%; max-width: 820px; position: relative;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 4px 8px;
  }
  .toolbar .side { font-size: 14px; opacity: .7; min-width: 80px; }
  .toolbar .side.right { text-align: right; }
  .back-btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 14px; color: #e8e8f0; text-decoration: none;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 999px; padding: 6px 18px;
    backdrop-filter: blur(6px);
  }
  .back-btn:hover { background: rgba(255,255,255,.15); }
  .pause-btn {
    font-size: 13px; padding: 6px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.08);
    color: #e8e8f0; cursor: pointer; letter-spacing: 1px; margin: 0;
  }
  .pause-btn:hover { background: rgba(255,255,255,.15); }
  #hud { display: flex; gap: 28px; margin-bottom: 8px; font-size: 15px; opacity: 0.75; }
  #hud b { color: #f5c518; font-variant-numeric: tabular-nums; }
  canvas {
    display: block; border-radius: 50%;
    box-shadow: 0 0 40px rgba(0,0,0,.6);
  }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.78);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: 42px; color: #f5c518; margin: 0 0 12px; letter-spacing: 6px; }
  .overlay p { font-size: 20px; margin: 6px 0; }
  .overlay b { color: #ff6b6b; font-size: 28px; }
  button {
    font-size: 20px; padding: 12px 48px; margin-top: 20px;
    border: none; border-radius: 10px; background: #e74c3c; color: #fff;
    cursor: pointer; letter-spacing: 4px;
  }
  button:hover { background: #c0392b; }
</style>
</head>
<body>
<div class="toolbar">
  <div class="side">弹力球</div>
  <a class="back-btn" href="index.html">← 棋类</a>
  <button class="pause-btn" id="pauseBtn" onclick="togglePause()" style="visibility:hidden">暂停</button>
</div>
<div id="hud">
  <span>时间 <b id="time">0.0</b> s</span>
  <span>球数 <b id="count">3</b></span>
</div>
<canvas id="cv"></canvas>

<div id="startOverlay" class="overlay show">
  <h2>圆 内 弹 力 球</h2>
  <p style="opacity:.7;font-size:16px;max-width:460px;text-align:center;line-height:1.9">
    暖色球动能大 → 撞出新球<br>
    冷色球动能大 → 随机删一球<br>
    只剩 1 球或塞满圆即结束
  </p>
  <button onclick="startGame()">开 始</button>
</div>

<div id="overOverlay" class="overlay">
  <h2 id="overTitle">结 束</h2>
  <p id="overReason"></p>
  <p>撑了 <b id="finalTime">0.0</b> 秒</p>
  <p>最终共 <b id="finalCount">2</b> 颗球</p>
  <button onclick="backToStart()">再 来 一 局</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

// 8色：4暖(0红 1橙 2黄 7粉) + 4冷(3绿 4青 5蓝 6紫)
const COLORS = ['#ff5a5f','#ff922b','#ffd43b','#51cf66','#22b8cf','#4dabf7','#b197fc','#ff6b9d'];
const WARM = new Set([0,1,2,7]);

let CX, CY, R, BR = 14;
let balls = [];
let events = [];         // {at, type:'add'|'remove', x,y,vx,vy,c}
let running = false, paused = false;
let rafId = null, tickTimer = null;
let endGameAt = null;   // 延迟1秒结算

const DT = 1000/60;
let physTime = 0, lastNow = 0, acc = 0;

function fitCanvas() {
  const availW = window.innerWidth - 16;
  const availH = window.innerHeight - 110;
  const size = Math.max(280, Math.min(availW, availH, 820));
  cv.style.width = size + 'px'; cv.style.height = size + 'px';
  cv.width = size; cv.height = size;
  CX = size/2; CY = size/2; R = size/2 - 2;
}

function randomPos() {
  const ang = Math.random()*Math.PI*2;
  const dist = (R - BR - 10) * (0.4 + 0.6*Math.random());
  return { x: CX+Math.cos(ang)*dist, y: CY+Math.sin(ang)*dist };
}

function setupBalls() {
  balls = []; events = []; physTime = 0; endGameAt = null;
  // 开局：2暖(红0, 黄2) + 1冷(蓝5)
  const positions = [];
  let g = 0;
  while (positions.length < 3 && g++ < 200) {
    const p = randomPos();
    let ok = true;
    for (const q of positions) {
      if (Math.hypot(p.x-q.x, p.y-q.y) < 5*BR) { ok = false; break; }
    }
    if (ok) positions.push(p);
  }
  const colors = [0, 2, 5];  // 红暖、黄暖、蓝冷
  for (let i = 0; i < 3; i++) {
    const ang = Math.random()*Math.PI*2, spd = 2.5+Math.random()*1.5;
    balls.push({ x:positions[i].x, y:positions[i].y,
                 vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd,
                 c:colors[i], dying:0 });
  }
}

function drawBackground() {
  const g = ctx.createRadialGradient(CX,CY,R*0.1,CX,CY,R);
  g.addColorStop(0,'#2c5364'); g.addColorStop(1,'#0f2027');
  ctx.beginPath(); ctx.arc(CX,CY,R,0,Math.PI*2); ctx.fillStyle = g; ctx.fill();
}

function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  drawBackground();
  for (const b of balls) {
    const r = b.dying > 0 ? BR * b.dying : BR;
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,Math.PI*2);
    ctx.fillStyle = COLORS[b.c];
    if (b.dying > 0) ctx.globalAlpha = b.dying;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(b.x-r*0.3,b.y-r*0.3,r*0.25,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill();
  }
}

function physicsStep() {
  // 到期事件
  while (events.length && events[0].at <= physTime) {
    const e = events.shift();
    if (e.type === 'add') {
      if (!tryAdd(e)) return;
    } else {
      doRemove();
    }
  }

  // 位置积分 + dying 动画推进
  for (const b of balls) {
    b.x += b.vx; b.y += b.vy;
    if (b.dying > 0) { b.dying -= 0.08; if (b.dying < 0) b.dying = 0; }
  }
  // 移除完成消失的球
  balls = balls.filter(b => !(b.dying === 0 && b.dead));

  // 等所有缩小动画播完、场上没有 dying 中的球时，才判断是否只剩1球结束
  const hasDying = balls.some(b => b.dying > 0);
  if (!hasDying && endGameAt === null) {
    const aliveCount = balls.filter(b => !b.dead).length;
    if (aliveCount <= 1) {
      endGameAt = physTime + 600;   // 延迟0.6秒再结算
    }
  }
  // 延迟到点，真正结束
  if (endGameAt !== null && physTime >= endGameAt) {
    endGame('冷方胜出，只剩一颗球');
    return;
  }

  // 撞壁：反射 + 速度放大3%（每碰一次壁动能+3%）
  for (const b of balls) {
    if (b.dead) continue;
    const dx=b.x-CX, dy=b.y-CY, dist=Math.hypot(dx,dy);
    if (dist > R-BR) {
      const nx=dx/dist, ny=dy/dist;
      b.x = CX+nx*(R-BR); b.y = CY+ny*(R-BR);
      const dot = b.vx*nx + b.vy*ny;
      b.vx -= 2*dot*nx; b.vy -= 2*dot*ny;
      b.vx *= 1.05; b.vy *= 1.05;
    }
  }

  // 两球相撞
  for (let i=0;i<balls.length;i++) {
    for (let j=i+1;j<balls.length;j++) {
      const a=balls[i], b=balls[j];
      if (a.dead || b.dead) continue;
      const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
      if (d > 0 && d < 2*BR) {
        const nx=dx/d, ny=dy/d;
        const overlap=2*BR-d;
        a.x -= nx*overlap/2; a.y -= ny*overlap/2;
        b.x += nx*overlap/2; b.y += ny*overlap/2;
        const va_n=a.vx*nx+a.vy*ny, vb_n=b.vx*nx+b.vy*ny;
        if (va_n-vb_n > 0) {
          // 记录碰撞前速度大小（动能）
          const speedA = Math.hypot(a.vx, a.vy);
          const speedB = Math.hypot(b.vx, b.vy);
          // 弹性碰撞
          const va_tx=a.vx-va_n*nx, va_ty=a.vy-va_n*ny;
          const vb_tx=b.vx-vb_n*nx, vb_ty=b.vy-vb_n*ny;
          a.vx=va_tx+vb_n*nx; a.vy=va_ty+vb_n*ny;
          b.vx=vb_tx+va_n*nx; b.vy=vb_ty+va_n*ny;
          // 动能大的那颗阵营决定加/删
          const winner = speedA >= speedB ? a : b;
          const isWarm = WARM.has(winner.c);
          const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
          const nvx=(a.vx+b.vx)/2 * 1.2;  // 注入20%动能
          const nvy=(a.vy+b.vy)/2 * 1.2;
          const randColor = Math.floor(Math.random()*8);
          events.push({
            at: physTime+100,
            type: isWarm ? 'add' : 'remove',
            x: cx, y: cy, vx: nvx, vy: nvy, c: randColor
          });
        }
      }
    }
  }
}

function tryAdd(s) {
  const offsets = [[0,0],[2*BR,0],[-2*BR,0],[0,2*BR],[0,-2*BR],
    [3*BR,3*BR],[-3*BR,3*BR],[3*BR,-3*BR],[-3*BR,-3*BR],
    [4*BR,0],[-4*BR,0],[0,4*BR],[0,-4*BR]];
  for (const [ox,oy] of offsets) {
    const x=s.x+ox, y=s.y+oy;
    if (Math.hypot(x-CX,y-CY) > R-BR-1) continue;
    let ok=true;
    for (const b of balls) {
      if (b.dead) continue;
      if (Math.hypot(b.x-x,b.y-y) < 2*BR-0.5) { ok=false; break; }
    }
    if (ok) { balls.push({x,y,vx:s.vx,vy:s.vy,c:s.c,dying:0,dead:false}); return true; }
  }
  endGame('圆被塞满了！');
  return false;
}

function doRemove() {
  // 随机选一颗还活着的球，标记 dying
  const alive = balls.map((b,i)=>b.dead?-1:i).filter(i=>i>=0);
  if (alive.length <= 1) return;  // 留至少1颗
  const idx = alive[Math.floor(Math.random()*alive.length)];
  balls[idx].dying = 1.0;
  balls[idx].dead = true;
}

function tick(now) {
  if (!running) return;
  if (!lastNow) lastNow = now;
  if (paused) { lastNow = now; draw(); return; }
  let delta = now - lastNow;
  lastNow = now;
  if (delta <= 0) return;
  if (delta > 5000) delta = 5000;
  acc += delta;
  while (acc >= DT) {
    physTime += DT;
    physicsStep();
    acc -= DT;
    if (!running) { draw(); return; }
  }
  document.getElementById('time').textContent = (physTime/1000).toFixed(1);
  document.getElementById('count').textContent = balls.filter(b=>!b.dead).length;
  draw();
}

function rafLoop(now) { if(!running) return; tick(now); rafId = requestAnimationFrame(rafLoop); }
function togglePause() {
  if (!running) return;
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '继续' : '暂停';
}

function endGame(reason) {
  running = false; paused = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
  document.getElementById('pauseBtn').style.visibility = 'hidden';
  document.getElementById('pauseBtn').textContent = '暂停';
  document.getElementById('overReason').textContent = reason;
  document.getElementById('finalTime').textContent = (physTime/1000).toFixed(1);
  const aliveNow = balls.filter(b=>!b.dead).length;
  document.getElementById('finalCount').textContent = aliveNow;
  document.getElementById('count').textContent = aliveNow;
  document.getElementById('overOverlay').classList.add('show');
}

function startGame() {
  document.getElementById('startOverlay').classList.remove('show');
  document.getElementById('overOverlay').classList.remove('show');
  running = true; paused = false;
  lastNow = 0; acc = 0;
  if (rafId) cancelAnimationFrame(rafId);
  if (tickTimer) clearInterval(tickTimer);
  document.getElementById('pauseBtn').style.visibility = 'visible';
  document.getElementById('pauseBtn').textContent = '暂停';
  rafId = requestAnimationFrame(rafLoop);
  tickTimer = setInterval(()=>tick(performance.now()), 250);
}

function backToStart() {
  document.getElementById('overOverlay').classList.remove('show');
  document.getElementById('pauseBtn').style.visibility = 'hidden';
  paused = false;
  setupBalls(); draw();
  document.getElementById('time').textContent = '0.0';
  document.getElementById('count').textContent = '3';
  document.getElementById('startOverlay').classList.add('show');
}

window.addEventListener('resize', () => { fitCanvas(); if (!running) { setupBalls(); draw(); } });

fitCanvas(); setupBalls(); draw();
</script>
</body>
</html>
